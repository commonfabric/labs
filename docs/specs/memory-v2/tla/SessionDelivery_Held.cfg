\* Client-declared holdings with frames held for schema document bodies
\* (delivery by reference, shipped): a frame naming a body the registry
\* lacks waits for its fetch, every later frame queues behind it, a body
\* that cannot be fetched drops its frame, and a disconnect discards the
\* queue, with lost pushes and a wiped replica still in play.
\* EXPECTED: all invariants HOLD — a reconnect converges the replica and
\* re-delivers nothing it holds, and between reconnects a session with
\* nothing held, lost or wiped is current.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Docs = {"d1", "d2"}
  MaxWrites = 3
  MaxLoss = 1
  AllowReset = TRUE
  Mode = "holdings"
  HoldMode = "inorder"
  MaxHeld = 2
INVARIANT TypeOK
INVARIANT ReconnectConverges
INVARIANT NoRedundantDelivery
INVARIANT SteadyConverges
