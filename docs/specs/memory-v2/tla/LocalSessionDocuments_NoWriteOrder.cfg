\* The hold without its write clause: a commit that wrote the local
\* document does not wait for the layers beneath it. A local-only write
\* confirms over a mixed commit still awaiting its verdict, and the mixed
\* commit's own promotion is then skipped.
\* EXPECTED: LocalConfirmedExact VIOLATED.
SPECIFICATION LocalSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Sessions = {"s1", "s2"}
  Paths = {"p"}
  LocalPaths = {"q"}
  Values = {"v"}
  MaxTotal = 4
  DepMode = "fullstack"
  BasisMode = "confirmed"
  DeliveryMode = "channel"
  IdentityMode = "none"
  ViewMode = "replay"
  HoldMode = "noWriteOrder"
INVARIANT LocalConfirmedExact
