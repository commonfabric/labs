\* The read-conditioned substitution under the identity exemption: a layer
\* whose read the foreign write made stale, and whose write the exemption
\* elides, is observed as a contributor while durable history holds the
\* foreign write of the same value, which the content form of INV-1 states
\* (ContentCoherence). Single-path writes, the ChannelIdentity bound.
\* EXPECTED: all invariants HOLD.
SPECIFICATION Spec
