\* The hold without its read clause: a commit that read the local document
\* through a pending layer is sent before that layer's verdict. The server
\* is not told of the dependency and accepts a commit the client drops when
\* the layer is rejected.
\* EXPECTED: AcceptedVersusDropped VIOLATED.
SPECIFICATION LocalSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Sessions = {"s1", "s2"}
  Paths = {"p"}
  LocalPaths = {"q"}
  Values = {"v"}
  MaxTotal = 4
  DepMode = "fullstack"
  BasisMode = "confirmed"
  DeliveryMode = "channel"
  IdentityMode = "none"
  ViewMode = "replay"
  HoldMode = "noReadHold"
INVARIANT AcceptedVersusDropped
