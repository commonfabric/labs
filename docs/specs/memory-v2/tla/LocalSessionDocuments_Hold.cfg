\* Local session documents as shipped: the client's own session-scoped
\* document never reaches the server, a mixed or validation-only commit's
\* verdict decides its session writes, and a commit that read or wrote the
\* local document waits for the pending layers of it that stood beneath.
\* The shared document is held to the pending-stack invariants and the
\* local one to their counterparts: no accepted commit read a session
\* write that was rolled back or lacks one that was accepted, the local
\* confirmed tier holds exactly the accepted writes, and every pending
\* layer is above it. INV-5 is not checked here; the Monotonic config is
\* its witness. EXPECTED: all invariants HOLD.
SPECIFICATION LocalSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Sessions = {"s1", "s2"}
  Paths = {"p"}
  LocalPaths = {"q"}
  Values = {"v"}
  MaxTotal = 4
  DepMode = "fullstack"
  BasisMode = "confirmed"
  DeliveryMode = "channel"
  IdentityMode = "none"
  ViewMode = "replay"
  HoldMode = "shipped"
INVARIANT LocalTypeOK
INVARIANT ReadCoherence
INVARIANT CascadeTotality
INVARIANT AcceptedVersusDropped
INVARIANT LocalReadCoherence
INVARIANT LocalConfirmedExact
INVARIANT LocalStackAboveConfirmed
