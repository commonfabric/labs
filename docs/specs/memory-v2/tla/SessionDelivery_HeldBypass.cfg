\* Frames held for schema document bodies, but a frame that names no
\* missing body applies at once, ahead of the frames held before it.
\* EXPECTED: SteadyConverges VIOLATED — a removal applied ahead of a held
\* push leaves the uncovered document held once the push drains; kept as
\* the witness that a held session's later frames must queue behind it.
\* ReconnectConverges still HOLDS: the next reconnect's declaration names
\* the stale document and the removal comes.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Docs = {"d1", "d2"}
  MaxWrites = 3
  MaxLoss = 1
  AllowReset = TRUE
  Mode = "holdings"
  HoldMode = "bypass"
  MaxHeld = 2
INVARIANT TypeOK
INVARIANT ReconnectConverges
INVARIANT NoRedundantDelivery
INVARIANT SteadyConverges
