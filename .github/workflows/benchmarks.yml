name: Benchmarks

# The bench-results artifacts feed the benchmark trend charts on the team ops
# dashboard (its /bench page), whose trend reads one completed run per
# four-hour window, so per-push samples add no resolution beyond a four-hourly
# cadence. Scheduled runs stay on the dedicated runner group; use the manual
# trigger to measure a specific commit.
#
# One of the benchmarks drives a browser against a running toolshed; the steps
# that build and start that server are part of this job for its sake. See
# docs/development/BENCHMARKS.md.
#
# The group is not a machine. It has served six processor models over a
# forty-five day stretch, and two runs on one model can be a fifth apart on
# work that touches no repository code at all, because each run gets whatever
# share of a host the other tenants leave it. The dashboard draws a separate
# line per processor model, which tells the models apart but not the hosts. So
# every run also measures the machine it landed on, through
# packages/dashboard/machine-calibration.bench.ts below, and the dashboard
# divides that measurement out of its trend. Without it a run that landed on a
# busy host reads on the tile as a code regression.
on:
  schedule:
    - cron: "0 */4 * * *" # Every 4 hours
  workflow_dispatch: {} # Allow manual trigger

jobs:
  benchmarks:
    name: "Run Benchmarks"
    runs-on:
      group: labs
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # The browser benchmark loads the shell the way a person does, so it needs
      # the server that serves it. The compiled binary carries the built shell;
      # a toolshed run from source serves nothing without one.
      - name: 🏗️ Build toolshed binary
        run: deno task build-binaries toolshed
        env:
          COMMIT_SHA: ${{ github.sha }}
          EXPERIMENTAL_SERVER_EXECUTION: "false"

      - name: 🔌 Start Toolshed server for the browser benchmark
        env:
          EXPERIMENTAL_SERVER_EXECUTION: "false"
        run: |
          chmod +x ./dist/toolshed
          # --background returns once the server has bound its port, so the
          # benchmark step never races a not-yet-listening server.
          CFTS_AI_GATEWAY_URL="" \
          CFTS_AI_LLM_ANTHROPIC_API_KEY=fake \
          ./dist/toolshed \
            --background --log-file="$RUNNER_TEMP/toolshed.log"

      # For Astral
      # https://github.com/lino-levan/astral/blob/f5ef833b2c5bde3783564a6b925073d5d46bb4b8/README.md#no-usable-sandbox-with-user-namespace-cloning-enabled
      - name: 🛡️ Disable AppArmor restriction for the browser benchmark
        shell: bash
        run: |
          sysctl_path=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -e "$sysctl_path" ]]; then
            printf '0\n' | sudo tee "$sysctl_path" >/dev/null
          else
            echo "AppArmor unprivileged-userns sysctl is unavailable; no change required."
          fi

      # The order files are listed in is not the order they run in. `deno bench`
      # picks its own, and holds to it: listing these same files in the reverse
      # order produces the identical report, and repeated runs of one order agree
      # with each other. What it picks puts the two browser files first and the
      # machine calibration near the end. That is stable enough for the
      # calibration to measure the same point of the job every time, which is
      # what makes it comparable across runs, but it is not something this list
      # chooses. Adding a file here does not place it.
      - name: 🏋️ Run benchmarks
        env:
          CF_LOG_LEVEL: silent
          API_URL: http://localhost:8000/
          EXPERIMENTAL_SERVER_EXECUTION: "false"
        run: |
          mkdir -p bench-results
          deno bench --json -A --v8-flags=--expose-gc \
            packages/runner/test/*.bench.ts \
            packages/utils/src/cache.bench.ts \
            packages/utils/test/string-tuple-key.bench.ts \
            packages/utils/test/deep-equal.bench.ts \
            packages/fuse/entity-projection.bench.ts \
            packages/memory/test/v2-entity-id-list.bench.ts \
            packages/memory/test/v2-cached-patch-replay.bench.ts \
            packages/memory/test/v2-engine-read.bench.ts \
            packages/memory/test/v2-path.bench.ts \
            packages/data-model/bench/hashing.bench.ts \
            packages/data-model/bench/codec-json.bench.ts \
            packages/dashboard/machine-calibration.bench.ts \
            packages/patterns/integration/topic-board-navigation.bench.ts \
            packages/patterns/integration/topic-board-scale.bench.ts \
            packages/patterns/integration/lunch-poll-vote-burst.bench.ts \
            packages/patterns/integration/lunch-poll-read-scale.bench.ts \
            > bench-results/results.json \
            2> >(tee bench-results/diagnostics.log >&2)

      # Fail the run when stdout carried anything besides the report, or when
      # the report is missing something the dashboard needs from it: the
      # processor identity, product measurements, the machine calibration, or
      # the two series the key benchmarks tile trends. Failing here makes each
      # of those a visible red run. It does not keep the artifact out of the
      # charts, because the dashboard reads a red run's artifact too. What the
      # dashboard does with a report missing one of these differs by which one:
      # a report that does not parse or names no processor is dropped whole, a
      # report without calibration is charted uncorrected, and measurements the
      # key tile selects by name are simply absent from it. None of that is a
      # corrupt report, but a chart that quietly thins says nothing about when
      # it started, so the run that produced one fails here instead. The checks
      # live in packages/dashboard/bench-report.ts, beside the code that reads
      # the report, so the two cannot drift apart.
      - name: ✅ Validate benchmark results
        run: >
          deno run --allow-read tasks/check-bench-report.ts
          bench-results/results.json

      - name: 📤 Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results
          path: bench-results/
          retention-days: 90
          if-no-files-found: ignore

      # A separate artifact: the dashboard reads the first JSON file in
      # bench-results, so nothing else belongs beside results.json.
      - name: 📋 Upload toolshed log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-toolshed-log
          path: ${{ runner.temp }}/toolshed.log
          retention-days: 14
          if-no-files-found: ignore
