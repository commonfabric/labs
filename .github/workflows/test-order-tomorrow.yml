name: Tomorrow's Test Order

# Runs every CI test suite at the head of main under the seed the next Pacific
# day's commits will shuffle their tests by, a day before any commit takes it.
#
# Every test run shuffles its tests by a seed, and the seed is the Pacific day
# the commit under test was committed on (docs/development/TESTING.md, "Every
# test run shuffles its order"). The order therefore changes with the first
# commit of each Pacific day. This run fails when a test fails under the next
# day's seed.
#
# The suites run once per seed, the first time this workflow finds that CI
# passed on the head of main. A head CI has not passed on would fail this run
# for reasons that have nothing to do with the order. The workflow starts each
# time CI passes on a push to main, and once a day at 11:17 UTC for a day when
# nothing lands. 11:17 UTC is early on a Pacific day in summer and in winter,
# so a scheduled run that GitHub starts hours late still asks for the same
# seed. tasks/test-order-tomorrow.ts decides; a run dispatched by hand runs
# the suites without asking.
#
# The suites are the CI workflow's own, called with the seed, which runs every
# test the way a push to main does. The CI workflow skips the job that gates
# coverage and topology, and its build, attestation and deploy jobs, when
# called. The records relay follows this workflow, and the records carry the
# seed they ran under, which keeps them apart from the commit's own runs.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: "17 11 * * *" # Daily, 11:17 UTC
  workflow_dispatch: {} # Allow manual trigger

# The runs that decide wait for one another, so that each sees whether the one
# before it ran the seed. GitHub keeps only the newest waiting run and cancels
# the others, which loses nothing, since each decides from the head of main as
# it stood when its event fired, and the newest waiting run's is the newest. A
# run that will skip every job, which is any run that CI failing or a pull
# request's CI started, and a run dispatched by hand, waits for nothing and
# displaces nothing.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')) && 'deciding' || github.run_id }}
  cancel-in-progress: false

jobs:
  seed:
    name: "Tomorrow's seed"
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 🔍 Resolve the seed of the next Pacific day
        id: seed
        run: |
          seed=$(deno task -q test-seed --tomorrow)
          echo "seed=$seed" >> "$GITHUB_OUTPUT"

      - name: 🔍 Decide whether this run runs the suites under the seed
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SEED: ${{ steps.seed.outputs.seed }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            run=true
          else
            run=$(deno run --allow-env --allow-net=api.github.com \
              tasks/test-order-tomorrow.ts "$SEED")
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # The name is what the run's checks on the commit are listed under, so it
  # has to tell them apart from the checks of the CI workflow's own run. The
  # seed in it is how tasks/test-order-tomorrow.ts finds the runs of a seed.
  ci:
    name: "Tomorrow's order (${{ needs.seed.outputs.seed }})"
    needs: seed
    if: needs.seed.outputs.run == 'true'
    uses: ./.github/workflows/deno.yml
    with:
      shuffle-seed: ${{ needs.seed.outputs.seed }}
    # A called workflow's jobs can hold no more than this grants, and GitHub
    # checks each of them against it before the run starts, including the
    # jobs the call skips. These are the permissions the CI workflow's jobs
    # ask for.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
