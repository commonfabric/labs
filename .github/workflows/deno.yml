          if-no-files-found: error

  generated-patterns-integration-test:
    name: "Generated Patterns Integration Tests (${{ matrix.shard }}/${{ matrix.total }})"
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        total: [2]
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 🧮 Resolve the compiler fingerprint
        id: compile-cache-key
        uses: ./.github/actions/compile-cache-key

      - name: ♻️ Restore/save generated pattern compile byte cache
        id: compile-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.compile-cache/generated-patterns-${{ matrix.shard }}.json
          key: cc-generated-patterns-${{ steps.compile-cache-key.outputs.fingerprint }}-${{ matrix.total }}-${{ matrix.shard }}-${{ hashFiles('packages/generated-patterns/**/*.ts', 'tasks/select-generated-pattern-files.ts') }}
          restore-keys: |
            cc-generated-patterns-${{ steps.compile-cache-key.outputs.fingerprint }}-${{ matrix.total }}-${{ matrix.shard }}-

      - name: 🧾 Record compile cache state for the Coverage Check
        uses: ./.github/actions/record-compile-cache-state
        with:
          family: generated-patterns
          shard: ${{ matrix.shard }}
          cache-file: ${{ github.workspace }}/.compile-cache/generated-patterns-${{ matrix.shard }}.json
          exact-hit: ${{ steps.compile-cache.outputs.cache-hit }}

      - name: 🧪 Run generated patterns integration tests
        timeout-minutes: *work-timeout
        working-directory: packages/generated-patterns
        env:
          CF_COMPILE_CACHE_FILE: ${{ github.workspace }}/.compile-cache/generated-patterns-${{ matrix.shard }}.json
          DENO_COVERAGE_DIR: ../../coverage/raw/generated-patterns-${{ matrix.shard }}
        run: |
          TEST_FILES=$(deno run --allow-read ../../tasks/select-generated-pattern-files.ts ${{ matrix.shard }}/${{ matrix.total }})
          if [ -z "$TEST_FILES" ]; then
            echo "::error::No generated pattern files selected for shard ${{ matrix.shard }}/${{ matrix.total }}"
            exit 1
          fi
          printf 'Generated patterns shard ${{ matrix.shard }}/${{ matrix.total }} files:\n'
          printf '  %s\n' $TEST_FILES
          mkdir -p ../../test-results
          LOG_LEVEL=warn deno test --shuffle=$(deno task -q test-seed) --trace-leaks -A --parallel \
            --junit-path=../../test-results/generated-patterns-${{ matrix.shard }}.xml \
            $TEST_FILES

      - name: 🧾 Write coverage report
        if: always()
        run: deno run --allow-read --allow-write --allow-run tasks/write-coverage-lcov.ts coverage/raw/generated-patterns-${{ matrix.shard }} coverage/lcov/generated-patterns-${{ matrix.shard }}.lcov

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile-generated-patterns-${{ matrix.shard }}
          path: coverage/lcov/generated-patterns-${{ matrix.shard }}.lcov
          retention-days: 90
          if-no-files-found: error

      - name: 📤 Upload test timing data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timing-generated-patterns-${{ matrix.shard }}
          path: test-results/
          retention-days: 90
          if-no-files-found: ignore

      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: generated-patterns-${{ matrix.shard }}
          job: >-
            Generated Patterns Integration Tests
            (${{ matrix.shard }}/${{ matrix.total }})
          shard: ${{ matrix.shard }}/${{ matrix.total }}
          junit: >-
            kind=integration,scope=generated-patterns,prefix=packages/generated-patterns,glob=test-results/generated-patterns-${{ matrix.shard }}.xml

  # ---------------------------------------------------------------------------
  # Tier 1 – Need built binaries
  # ---------------------------------------------------------------------------

  package-integration-test:
    name: "Package Integration Tests (${{ matrix.suite_name }})"
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    needs: ["build-toolshed"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite_name: runner
            package_dir: packages/runner
            junit_name: runner
            step_name: runner integration tests
            headless: false
          - suite_name: runtime-client
            package_dir: packages/runtime-client
            junit_name: runtime-client
            step_name: runtime-client integration tests
            headless: false
          - suite_name: shell
            package_dir: packages/shell
            junit_name: shell
            step_name: shell integration tests
            headless: true
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 🧭 Resolve default server-execution posture
        timeout-minutes: *posture-probe-timeout
        run: deno run tasks/server-execution-ci-command.ts env default >> "$GITHUB_ENV"

      - name: 📥 Download toolshed binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-toolshed
          path: common-binaries

      - name: 🔌 Start Toolshed server for testing
        env:
          TOOLSHED_PORT: 8000
        run: |
          chmod +x ./common-binaries/toolshed
          # --background spawns the server, waits until it has bound its port,
          # then returns, so the test steps never race a not-yet-listening
          # server. The server logs to --log-file, which the launcher prints on
          # success and dumps if the server exits before binding.
          # This lane leaves the flag unset and follows the first-party default.
          CFTS_AI_GATEWAY_URL="" \
          CFTS_AI_LLM_ANTHROPIC_API_KEY=fake \
          ./common-binaries/toolshed --port="$TOOLSHED_PORT" \
            --background --log-file="$RUNNER_TEMP/toolshed.log"

      # For Astral
      # https://github.com/lino-levan/astral/blob/f5ef833b2c5bde3783564a6b925073d5d46bb4b8/README.md#no-usable-sandbox-with-user-namespace-cloning-enabled
      - name: 🛡️ Disable AppArmor restriction for browser tests
        shell: bash
        run: |
          sysctl_path=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -e "$sysctl_path" ]]; then
            printf '0\n' | sudo tee "$sysctl_path" >/dev/null
          else
            echo "AppArmor unprivileged-userns sysctl is unavailable; no change required."
          fi

      - name: ✅ Verify the default server-execution posture
        timeout-minutes: *posture-probe-timeout
        env:
          TOOLSHED_PORT: 8000
        run: deno run --allow-net tasks/server-execution-ci-command.ts probe default "http://localhost:${TOOLSHED_PORT}"

      - name: 🧪 Run ${{ matrix.step_name }}
        timeout-minutes: *work-timeout
        working-directory: ${{ matrix.package_dir }}
        env:
          DENO_COVERAGE_DIR: ../../coverage/raw/package-${{ matrix.suite_name }}
          HEADLESS_ENABLED: ${{ matrix.headless }}
          JUNIT_NAME: ${{ matrix.junit_name }}
          TOOLSHED_PORT: 8000
        run: |
          mkdir -p ../../test-results
          if [ "$HEADLESS_ENABLED" = "true" ]; then
            export HEADLESS=1
          fi
          SX_ON_IGNORE=""
          if [ "$SERVER_EXECUTION_ENABLED" = "true" ]; then
            # The skip registry belongs to the ON arm, whichever stable role
            # currently carries it.
            SX_ON_IGNORE=$(deno run --allow-read ../../tasks/server-execution-on-skips.ts ${{ matrix.suite_name }})
          else
            echo "Server execution is OFF; the ON-arm skip registry does not apply."
          fi
          API_URL="http://localhost:${TOOLSHED_PORT}/" \
          INTEGRATION_TEST_FLAGS="--junit-path=../../test-results/${JUNIT_NAME}.xml ${SX_ON_IGNORE}" \
          deno task integration

      - name: 📋 Upload toolshed log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolshed-log-package-integration-${{ matrix.junit_name }}
          path: ${{ runner.temp }}/toolshed.log
          retention-days: 14
          if-no-files-found: ignore

      - name: 🧾 Write coverage report
        if: always()
        run: deno run --allow-read --allow-write --allow-run tasks/write-coverage-lcov.ts coverage/raw/package-${{ matrix.suite_name }} coverage/lcov/package-${{ matrix.suite_name }}.lcov

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile-package-${{ matrix.suite_name }}
          path: coverage/lcov/package-${{ matrix.suite_name }}.lcov
          retention-days: 90
          if-no-files-found: error

      - name: 📤 Upload test timing data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timing-package-integration-${{ matrix.suite_name }}
          path: test-results/${{ matrix.junit_name }}.xml
          retention-days: 90
          if-no-files-found: ignore

      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: package-integration-${{ matrix.suite_name }}
          job: Package Integration Tests (${{ matrix.suite_name }})
          junit: >-
            kind=integration,scope=${{ matrix.suite_name }},prefix=${{ matrix.package_dir }},glob=test-results/${{ matrix.junit_name }}.xml
  # The opposite role runs the same suites with an explicit inverse of the
