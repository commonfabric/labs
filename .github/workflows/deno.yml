name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The run of the suites in the next day's order calls this workflow with that
  # day's seed; see .github/workflows/test-order-tomorrow.yml. A called run
  # runs the tests and nothing else. The jobs that gate the commit on coverage
  # and topology, and the jobs that attest and deploy it, run only for a push
  # or a pull request, whose own run already covers the commit.
  workflow_call:
    inputs:
      shuffle-seed:
        description: The seed every test runner in the run shuffles by.
        type: string
        required: true

# Runs of a pull request are grouped by the pull request, and a new push to the
# branch cancels the run already going. Runs of a push to main are grouped by
# the commit that was pushed, and a push run is never cancelled: it may be
# part-way through deploying that commit to staging. Main can receive the same
# head commit twice, which starts two runs of one commit, and the commit as the
# group makes the second of them wait for the first. Each run publishes a
# release artifact named after the commit, and two runs publishing at once
# leave one run's tarball beside the other run's checksum. See "One commit, one
# set of artifacts" in docs/development/deploying.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The bounds the jobs below are built from. They are YAML anchors, used as
# aliases at each job and each work step, so the numbers live here and nowhere
# else. Most jobs take the first pair. The CLI integration suites take the
# `cli-` ones, which are tighter because a wedged suite there is what they were
# sized against. See "Step And Job Timeouts" in
# docs/development/CI_PERFORMANCE.md for the sizing rule. The environment
# variables holding the numbers are how a workflow declares a value an anchor
# can name; nothing reads them.
env:
  # GitHub's Ubuntu image includes Chrome. Astral uses it directly instead of
  # downloading another browser when the first browser test starts.
  ASTRAL_BIN_PATH: /usr/bin/google-chrome
  # Empty unless a caller names a seed, and an empty value leaves every runner
  # on the seed of the commit under test.
  CF_TEST_SHUFFLE_SEED: ${{ inputs.shuffle-seed }}
  WORK_TIMEOUT_MINUTES: &work-timeout 30
  JOB_TIMEOUT_MINUTES: &job-timeout 40
  CLI_WORK_TIMEOUT_MINUTES: &cli-work-timeout 10
  CLI_FUSE_WORK_TIMEOUT_MINUTES: &cli-fuse-work-timeout 15
  CLI_JOB_TIMEOUT_MINUTES: &cli-job-timeout 25
  # Server-execution role resolution and posture probes take this one; it is
  # sized for short control-plane checks, not a suite.
  POSTURE_PROBE_TIMEOUT_MINUTES: &posture-probe-timeout 5

# Every step name must begin with a phase-marker emoji (setup / work / shutdown).
# scripts/ci-gantt.ts reads that emoji to split each job bar by phase. See the
# "Step phase markers" table in docs/development/CI_PERFORMANCE.md for the
# vocabulary and which emoji belongs to which phase.
#
# Every work step carries a bound of its own, and the bound on the job around it
# is at least ten minutes longer. GitHub ends a job that runs past its bound by
# cancelling it, while a step that reaches its own bound fails. An individual
# wedged step normally reaches its bound first; the job bound remains the final
# limit when several sequential steps take unusually long.
# tasks/ci-workflow.test.ts holds every work step here to that shape, and
# refuses a bound written as anything but an alias.
#
# The deploy jobs at the end carry no bound. Each hands the work to a script
# that lives elsewhere, and how long that takes is not this workflow's to say.
jobs:
  # ---------------------------------------------------------------------------
  # Tier 0 – These jobs all start immediately with no dependencies
  # GitHub allows this organization 60 parallel hosted runners. Keep this
  # dependency-free wave below that shared limit so overlapping runs leave
  # capacity for one another and for jobs whose dependencies have completed.
  # See "Current Posture" in docs/development/CI_PERFORMANCE.md.
  # ---------------------------------------------------------------------------
  check:
    name: "Check"
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 🔎 Check codebase formatting
        timeout-minutes: *work-timeout
        run: deno task run-recorded format repo deno-fmt -- deno fmt --check

      - name: 🧹 Lint codebase
        timeout-minutes: *work-timeout
        run: |
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern="$GITHUB_WORKSPACE/deno-core.%p"
          deno task run-recorded lint repo deno-lint -- deno lint

      - name: 📋 Describe Deno lint core dump
        if: ${{ failure() }}
        run: |
          shopt -s nullglob
          cores=(deno-core.*)
          for core in "${cores[@]}"; do
            file "$core"
          done

      - name: 📤 Upload Deno lint core dump
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deno-lint-core-a${{ github.run_attempt }}
          path: deno-core.*
          if-no-files-found: ignore
          retention-days: 14

      # This is the only type check for the paths listed in
      # tasks/typecheck.ts: the test jobs in this workflow and the package
      # test tasks run with --no-check and rely on it. Removing a path from
      # that list removes its type checking entirely. The task records one
      # typecheck-kind test per package group itself, so it carries no
      # run-recorded wrapper.
      - name: 🔎 Type check codebase
        timeout-minutes: *work-timeout
        run: deno task check

      - name: 🧭 Check agent-facing facts
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-skill-facts --
          deno task check-skill-facts

      - name: 🧭 Check address examples
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-address-examples --
          deno task check-address-examples

      - name: 🚧 Check tripwires
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-tripwires --
          deno task check-tripwires

      - name: 📄 Type-check docs code blocks
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-docs --
          deno task check-docs

      - name: 🔎 Check the historical-documentation index
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-docs-history-index --
          deno task check-docs-history-index

      - name: 🔎 Check the benchmarks workflow against the names the dashboard reads
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-bench-workflow --
          deno task check-bench-workflow

      - name: 🚧 Guard against new polling waitFor in integration tests
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-no-waitfor --
          deno task check-no-waitfor

      - name: 🩹 Check for unresolved merge-conflict markers
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-conflict-markers --
          deno task check-conflict-markers

      - name: 🚧 Guard every test runner to shuffle its order
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-test-shuffle --
          deno task check-test-shuffle

      - name: 🩹 Check for literal control characters in source
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-control-characters --
          deno task check-control-characters

      - name: 🚧 Guard the verb-session walkthrough against its demo
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-verb-session-sync --
          deno task check-verb-session-sync

      - name: 🔎 Check pattern tier markers
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-pattern-tiers --
          deno task check-pattern-tiers

      - name: 🔎 Check for unused import map dependencies
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-unused-deps --
          deno task check-unused-deps

      - name: 🔎 Check Deno toolchain pins are aligned
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-deno-pins --
          deno task check-deno-pins

      - name: 🔎 Check action pins run the release they name
        timeout-minutes: *work-timeout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          deno task run-recorded gate repo check-action-pins --
          deno task check-action-pins

      - name: 🔎 Check single-copy packages resolve once
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-single-copy-deps --
          deno task check-single-copy-deps

      - name: 🚧 Guard against new import cycles between packages
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-package-cycles --
          deno task check-package-cycles

      - name: 🚧 Guard against programs built from local files by hand
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-local-program --
          deno task check-local-program

      - name: 🚧 Guard against a CLI slot nobody decided about completing
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-completion-slots --
          deno task check-completion-slots

      - name: 🚧 Guard against a CLI command nobody documented
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-command-docs --
          deno task check-command-docs

      - name: 🔎 Check generated commonfabric/cfc types are up to date
        timeout-minutes: *work-timeout
        working-directory: packages/static
        run: >-
          deno task run-recorded gate repo check-cfc-types --
          deno task check-cfc-types

      - name: 🔎 Check generated commonfabric types are up to date
        timeout-minutes: *work-timeout
        working-directory: packages/static
        run: >-
          deno task run-recorded gate repo check-commonfabric-types --
          deno task check-commonfabric-types

      - name: 🔎 Check type libraries declare no withheld globals
        timeout-minutes: *work-timeout
        working-directory: packages/static
        run: >-
          deno task run-recorded gate repo check-withheld-globals --
          deno task check-withheld-globals

      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: check
          job: Check

  cfcheck:
    name: "CFC Pattern Check"
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 🔎 Check Common Fabric patterns
        timeout-minutes: *work-timeout
        run: deno task run-recorded typecheck repo cfcheck -- deno task cfcheck

      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: cfcheck
          job: CFC Pattern Check

  pattern-compat:
    name: "Pattern Update Compatibility (${{ matrix.shard }}/${{ matrix.total }})"
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # Proves every pattern can still be applied over each contract recorded
      # under packages/patterns/baselines/. The automatic updater performs NO
      # structural check before swapping a pattern onto a running piece, so an
      # incompatible schema that merges here reaches every deployed piece.
      - name: 🔎 Check pattern update compatibility
        timeout-minutes: *work-timeout
        env:
          PATTERN_COMPAT_SHARD: "${{ matrix.shard }}/${{ matrix.total }}"
        run: >-
          deno task run-recorded gate repo pattern-compat --
          deno task pattern-compat

      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: pattern-compat-${{ matrix.shard }}
          job: >-
            Pattern Update Compatibility
            (${{ matrix.shard }}/${{ matrix.total }})
          shard: ${{ matrix.shard }}/${{ matrix.total }}

  pattern-vintage:
    name: "Pattern Update State and Baseline Integrity"
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The baseline check diffs against the merge base and needs real
        # history. The replay step reads the same full checkout.
        with:
          fetch-depth: 0

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # Tier 2. pattern-compat proves the CONTRACT still fits; this replays a
      # real captured DOCUMENT under today's source and fails if today's source
      # cannot be materialized over it — the additive-required migration
      # refuses a setup commit that no contract check sees as a failure to
      # apply. The space roots auto-update onto a root someone is already
      # using, so a break here bricks a live piece.
      #
      # It also checks the values SURVIVE, not merely that the migration
      # applied: a moved storage key (`.for('x')` → `.for('y')`) leaves the
      # declared contract untouched while the old documents go unreachable, and
      # that now exits 1 naming the key. Emptiness is judged per leaf, so
      # partial loss counts too.
      #
      # The limit worth knowing (docs/specs/pattern-update-testing.md):
      # a value that merely CHANGED is warned about rather than failed on,
      # because a replay recomputes as well as reads. So a moved key whose new
      # slot the pattern SEEDS reads back non-empty and only warns. The same
      # move into a slot that stays empty DOES fail, and
      # `tasks/pattern-vintage-run.test.ts` pins both halves by name.
      #
      # EVERY fixture is replayed, both tiers. `pinned/` is what CREDITS
      # coverage — it is never pruned — while `auto/` accumulates generations
      # so today's source is proved against every world a pattern has passed
      # through, not just one. Committing a fixture is the whole of adding one;
      # there is no list here of what gets replayed.
      #
      # This job only ever READS the tree. Capturing (`--capture-changed`) and
      # promoting (`--pin`) are commands someone runs and commits, deliberately
      # not CI steps: a gate that wrote its own evidence would be grading its
      # own homework.
      - name: 🔁 Replay every committed vintage under today's source
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo pattern-vintage --
          deno task pattern-vintage

      # The gate's safety argument is that `--update` can only ADD a baseline.
      # `rm` is not `--update`, and one deleted file hides easily in a diff full
      # of recorded JSON — so deleting a baseline without retiring its pattern
      # is refused here.
      - name: 🔎 Check pattern baselines are append-only
        if: ${{ !cancelled() }}
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-baselines-append-only --
          deno task check-baselines-append-only
          origin/${{ github.base_ref || 'main' }}

      - name: 🔎 Check test-identity aliases are append-only
        if: ${{ !cancelled() }}
        timeout-minutes: *work-timeout
        run: >-
          deno task run-recorded gate repo check-test-aliases --
          deno task check-test-aliases
          origin/${{ github.base_ref || 'main' }}

      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: pattern-vintage
          job: Pattern Update State and Baseline Integrity

  test:
    name: "Test (${{ matrix.shard }}/${{ matrix.total }})"
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        total: [8]
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 📦 Install Linux FUSE test dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: pkg-config gcc libfuse3-dev fuse3
          cache-key: cfc-pattern-check

      # For deno-web-test browser tests
      # https://github.com/lino-levan/astral/blob/f5ef833b2c5bde3783564a6b925073d5d46bb4b8/README.md#no-usable-sandbox-with-user-namespace-cloning-enabled
      - name: 🛡️ Disable AppArmor restriction for browser tests
        shell: bash
        run: |
          sysctl_path=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [[ -e "$sysctl_path" ]]; then
            printf '0\n' | sudo tee "$sysctl_path" >/dev/null
          else
            echo "AppArmor unprivileged-userns sysctl is unavailable; no change required."
          fi

      - name: 🧪 Run parallel workspace tests
        timeout-minutes: *work-timeout
        run: deno task test
        env:
          DENO_COVERAGE_DIR: coverage/raw/workspace-${{ matrix.shard }}
          TEST_DISABLED_PACKAGES: runner
          TEST_SHARD: "${{ matrix.shard }}/${{ matrix.total }}"

      - name: 🧾 Write coverage report
        if: always()
        run: deno run --allow-read --allow-write --allow-run tasks/write-coverage-lcov.ts coverage/raw/workspace-${{ matrix.shard }} coverage/lcov/workspace-${{ matrix.shard }}.lcov

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile-workspace-${{ matrix.shard }}
          # The second path is the record of the packages this shard selected
          # and never started, which the coverage gate reads to decide which
          # groups this run can speak for. A shard that started everything it
          # selected writes no such file; both paths sit in one directory, so
          # the artifact's layout is the same either way.
          path: |
            coverage/lcov/workspace-${{ matrix.shard }}.lcov
            coverage/lcov/unlaunched-members.txt
          retention-days: 90
          if-no-files-found: error

      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: test-${{ matrix.shard }}
          job: Test (${{ matrix.shard }}/${{ matrix.total }})
          shard: ${{ matrix.shard }}/${{ matrix.total }}

  runner-test:
    name: "Runner Tests (${{ matrix.shard }}/${{ matrix.total }})"
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
        total: [8]
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 🧪 Run runner tests
        timeout-minutes: *work-timeout
        working-directory: packages/runner
        env:
          DENO_COVERAGE_DIR: ../../coverage/raw/runner-${{ matrix.shard }}
        run: |
          TEST_FILES=$(deno run --allow-read ../../tasks/select-runner-test-files.ts ${{ matrix.shard }}/${{ matrix.total }})
          if [ -z "$TEST_FILES" ]; then
            echo "::error::No runner test files selected for shard ${{ matrix.shard }}/${{ matrix.total }}"
            exit 1
          fi
          printf 'Runner test shard ${{ matrix.shard }}/${{ matrix.total }} files:\n'
          printf '  %s\n' $TEST_FILES
          mkdir -p ../../test-results
          # --no-check: the Check job type-checks packages/runner
          # (tasks/check.sh). The first --preload runs the fake clock before
          # every test module, the same as the package test task; without it
          # the global `clock` the converted tests use is undefined. See
          # test/clock-preload.ts. The second captures the file each test
          # registers from, which is what gives the shipped records their
          # file metadata; it writes that map into the spool, so the spool
          # is in the write list beside the temporary directories, or the
          # preload finds nowhere to put it and declines to install.
          # These permissions mirror the `test` task in
          # packages/runner/deno.jsonc; a test that needs a new one needs it
          # in both places, because this shard runs deno test directly.
          ENV=test deno test --shuffle=$(deno task -q test-seed) \
            --no-check \
            --preload=test/clock-preload.ts \
            --preload=../../packages/test-support/src/records/preload.ts \
            --junit-path=../../test-results/runner-${{ matrix.shard }}.xml \
            --allow-ffi \
            --allow-env \
            --allow-net=127.0.0.1 \
            --allow-read \
            --allow-write=/tmp,/var/folders,$CF_TEST_RECORDS_DIR \
            --allow-run=git,deno,"$(deno eval "console.log(Deno.execPath())")" \
            $TEST_FILES

      - name: 🧾 Write coverage report
        if: always()
        run: deno run --allow-read --allow-write --allow-run tasks/write-coverage-lcov.ts coverage/raw/runner-${{ matrix.shard }} coverage/lcov/runner-${{ matrix.shard }}.lcov

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile-runner-${{ matrix.shard }}
          path: coverage/lcov/runner-${{ matrix.shard }}.lcov
          retention-days: 90
          if-no-files-found: error

      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: runner-test-${{ matrix.shard }}
          job: Runner Tests (${{ matrix.shard }}/${{ matrix.total }})
          shard: ${{ matrix.shard }}/${{ matrix.total }}
          junit: >-
            kind=unit,scope=runner,prefix=packages/runner,glob=test-results/runner-${{ matrix.shard }}.xml

  build-toolshed:
    name: "Build Binary (toolshed)"
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # The co-presence endpoint the shell EMBEDDED IN THIS BINARY offers to
      # collaborative editors. `SHELL_PRESENCE_URL` is the repository variable
      # holding the value; `PRESENCE_URL` is the process variable
      # packages/shell/felt.config.ts reads and bakes in as the
      # `$PRESENCE_URL` define — the same mapping deploy-shell-staging makes
      # for the bucket shell, from its own variable. This binary is the one
      # both estuary and rapids deploy, so both carry whatever is baked here,
      # and changing the variable takes a rebuild before it reaches either.
      # Unset omits the define and co-presence stays disabled, which is why
      # this does not fail the way an unset API URL does: a shell with no
      # presence endpoint is a working shell. The job then succeeds either way,
      # so which of the two shells a binary carries would leave no trace in it;
      # the step says which, and the log is where that answer is.
      - name: 🔎 Validate the embedded shell's presence endpoint
        timeout-minutes: *work-timeout
        env:
          PRESENCE_URL: ${{ vars.SHELL_PRESENCE_URL }}
        run: |
          if [ -n "$PRESENCE_URL" ]; then
            # `deno eval` holds every permission implicitly, so the module read
            # and the environment lookup need no flags; the subcommand takes no
            # `--allow-read` or `--allow-env` and fails on either as an unknown
            # argument. What reaches GITHUB_ENV is `URL.href`, so it is the
            # normalized spelling the bundle carries and the grep below matches.
            PRESENCE_URL="$(deno eval '
              import { optionalPresenceUrl } from "./packages/shell/src/lib/presence-url.ts";
              console.log(optionalPresenceUrl(Deno.env.get("PRESENCE_URL"))?.href ?? "");
            ')"
            echo "PRESENCE_URL=$PRESENCE_URL" >> "$GITHUB_ENV"
            echo "The embedded shell gets presence service $PRESENCE_URL."
          else
            echo "SHELL_PRESENCE_URL is unset: the embedded shell gets no presence endpoint, so editor co-presence is off in every deployment of this binary."
          fi

      - name: 🏗️ Build toolshed binary
        timeout-minutes: *work-timeout
        run: |
          deno task build-binaries toolshed

          # shell-frontend is what the binary serves in production. An endpoint
          # that was configured but did not reach the bundle would deploy a
          # shell whose co-presence is silently off, and nothing downstream
          # looks, so confirm the define landed before the binary is uploaded.
          if [ -n "$PRESENCE_URL" ] && \
            ! grep -rqF -e "$PRESENCE_URL" packages/toolshed/shell-frontend/scripts; then
            echo "::error::The embedded shell does not reference $PRESENCE_URL."
            exit 1
          fi
        env:
          COMMIT_SHA: ${{ github.sha }}

      - name: 📤 Upload toolshed binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-toolshed
          path: ./dist/toolshed
          if-no-files-found: error

  # The posture opposite the first-party default must be baked into its own
