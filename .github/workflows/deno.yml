name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # A label is how a pull request asks for the full run, so adding or
    # removing one starts a run that reads the labels it now carries. A
    # re-run would read the labels of the event it repeats.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The run of the suites in the next day's order calls this workflow with that
  # day's seed; see .github/workflows/test-order-tomorrow.yml. A called run
  # runs every test and nothing else. The job that gates the commit on coverage
  # and topology, and the jobs that build, attest and deploy it, run only for a
  # push or a pull request, whose own run already covers the commit.
  workflow_call:
    inputs:
      shuffle-seed:
        description: The seed every test runner in the run shuffles by.
        type: string
        required: true

# Runs of a pull request are grouped by the pull request, and a new push to the
# branch cancels the run already going. Runs of a push to main are grouped by
# the commit that was pushed, and a push run is never cancelled: it may be
# part-way through deploying that commit to staging. Main can receive the same
# head commit twice, which starts two runs of one commit, and the commit as the
# group makes the second of them wait for the first. Each run publishes a
# release artifact named after the commit, and two runs publishing at once
# leave one run's tarball beside the other run's checksum. See "One commit, one
# set of artifacts" in docs/development/deploying.md.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The bounds the jobs below are built from. They are YAML anchors, used as
# aliases at each job and each work step, so the numbers live here and nowhere
# else. See "Step And Job Timeouts" in docs/development/CI_PERFORMANCE.md for
# the sizing rule. The environment variables holding the numbers are how a
# workflow declares a value an anchor can name; nothing reads them.
env:
  # GitHub's Ubuntu image includes Chrome. Astral uses it directly instead of
  # downloading another browser when the first browser test starts.
  ASTRAL_BIN_PATH: /usr/bin/google-chrome
  # Empty unless a caller names a seed, and an empty value leaves every runner
  # on the seed of the commit under test.
  CF_TEST_SHUFFLE_SEED: ${{ inputs.shuffle-seed }}
  # Where the record store and the selection manifests are, as every
  # workflow reading or writing them names it. An unset variable leaves the
  # default in place.
  TEST_RECORDS_BUCKET: ${{ vars.TEST_RECORDS_BUCKET }}
  TEST_RECORDS_PREFIX: ${{ vars.TEST_RECORDS_PREFIX }}
  TEST_SELECTION_PREFIX: ${{ vars.TEST_SELECTION_PREFIX }}
  WORK_TIMEOUT_MINUTES: &work-timeout 30
  JOB_TIMEOUT_MINUTES: &job-timeout 40

# Every step name must begin with a phase-marker emoji (setup / work / shutdown).
# scripts/ci-gantt.ts reads that emoji to split each job bar by phase. See the
# "Step phase markers" table in docs/development/CI_PERFORMANCE.md for the
# vocabulary and which emoji belongs to which phase.
#
# Every work step carries a bound of its own, and the bound on the job around it
# is at least ten minutes longer. GitHub ends a job that runs past its bound by
# cancelling it, while a step that reaches its own bound fails. An individual
# wedged step normally reaches its bound first; the job bound remains the final
# limit when several sequential steps take unusually long.
# tasks/ci-workflow.test.ts holds every work step here to that shape, and
# refuses a bound written as anything but an alias.
#
# The deploy jobs at the end carry no bound. Each hands the work to a script
# that lives elsewhere, and how long that takes is not this workflow's to say.
jobs:
  # ---------------------------------------------------------------------------
  # The tests. Every test the repository has is declared in the test topology
  # (tasks/test-topology.ts), and a lane runs its share of them through
  # tasks/ci-lane.ts. Nothing here names a suite: adding a test, a kind of
  # test, or a configuration of existing tests is a change to the topology and
  # never to this file. docs/development/test-selection.md is the guide.
  #
  # A pull request runs five lanes over a selection chosen from the record
  # store. A push to main, a called run, and a pull request labelled `ci: full`
  # run every test instead, over as many lanes as `plan-full` counts.
  # ---------------------------------------------------------------------------
  plan-full:
    name: "Plan Full Run"
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci: full')
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    permissions:
      contents: read
    # The lanes read these, and fall back to a pull request's five lanes over
    # a selection where this job was skipped.
    outputs:
      of: ${{ steps.count.outputs.of }}
      lanes: ${{ steps.count.outputs.lanes }}
      args: --full
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # A count is all of the plan that passes from here to the lanes. Each lane
      # reads the same tree against the same manifest and packs the same plan
      # for itself, so there is no second planner to disagree with the lanes.
      - name: 🗺️ Count the lanes the full run needs
        id: count
        timeout-minutes: *work-timeout
        run: |
          of=$(deno run -A tasks/ci-lane.ts --full --lane-count)
          lanes=$(jq -cn --argjson of "$of" '[range(1; $of + 1)]')
          echo "of=$of" >> "$GITHUB_OUTPUT"
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"

  tests:
    name: "Tests (${{ matrix.lane }}/${{ needs.plan-full.outputs.of || 5 }})"
    needs: plan-full
    # A pull request skips `plan-full`, so its lanes start at once; a run of
    # every test waits for the count.
    if: >-
      !cancelled() &&
      (needs.plan-full.result == 'success' || needs.plan-full.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    permissions:
      contents: read
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
      LANE_ARGS: >-
        --lane ${{ matrix.lane }} --of ${{ needs.plan-full.outputs.of || 5 }}
        ${{ needs.plan-full.outputs.args ||
        format('--base origin/{0}', github.base_ref) }}
      LANE_JOB: Tests (${{ matrix.lane }}/${{ needs.plan-full.outputs.of || 5 }})
    strategy:
      fail-fast: false
      matrix:
        # Every lane of the run packs the same plan and takes its own share of
        # it, so nothing tells a lane what to run beyond its number.
        lane: ${{ fromJSON(needs.plan-full.outputs.lanes || '[1, 2, 3, 4, 5]') }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The diff behind a pull request is taken against the merge base, and
        # the gates that hold a file to being appended to read the base
        # revision, so the lane needs real history.
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # The plan heads a step of its own, where a reader of a running job
      # finds it: GitHub folds away the top of a step thousands of lines
      # long, which is what the lane's step becomes. The lane's step packs
      # the same plan again from the same tree and manifest, and names it in
      # one line. The arguments are a list of words, and splitting them is
      # the point.
      - name: 🗺️ Plan the lane
        timeout-minutes: *work-timeout
        run: |
          # shellcheck disable=SC2086
          deno run -A tasks/ci-lane.ts $LANE_ARGS --dry-run

      - name: 🧮 Resolve what the lanes' binaries are built from
        id: binary-cache-key
        run: |
          key=$(deno run --allow-read --allow-run=git tasks/binary-cache-key.ts)
          # An empty key would name every build alike, and a lane would then
          # run a binary built from other sources.
          if [ -z "$key" ]; then
            echo "::error::tasks/binary-cache-key.ts printed no key."
            exit 1
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: 🧮 Resolve the compiler fingerprint
        id: compile-cache-key
        uses: ./.github/actions/compile-cache-key

      # A lane uses a binary it finds here without asking what it was built
      # from, so each key is exact and has no restore prefix: it names every
      # source a binary is built from and every variable its build is given.
      # A lane that finds nothing builds what it needs in place. Each binary
      # is kept under a key of its own, because a lane builds only the ones
      # it needs, and one entry holding both would keep whichever the first
      # lane to save happened to build.
      - name: ♻️ Restore/save the lanes' default-posture Toolshed binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ci-cache/binaries/toolshed-baked-default
          key: lane-binary-toolshed-baked-default-${{ steps.binary-cache-key.outputs.key }}

      - name: ♻️ Restore/save the lanes' opposite-posture Toolshed binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ci-cache/binaries/toolshed-baked-opposite
          key: lane-binary-toolshed-baked-opposite-${{ steps.binary-cache-key.outputs.key }}

      # A compiled pattern is reused only where its source is unchanged, so a
      # cache left by another lane or an earlier commit costs nothing but the
      # time to restore it. The key moves with the pattern sources, so that a
      # lane restoring an older entry saves a fresher one; an entry an exact
      # key hits is never saved again.
      - name: ♻️ Restore/save the lanes' pattern compile byte cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ci-cache/compile
          key: cc-lane-${{ steps.compile-cache-key.outputs.fingerprint }}-${{ github.job }}-${{ matrix.lane }}-${{ hashFiles('packages/patterns/**', 'packages/generated-patterns/**') }}
          restore-keys: |
            cc-lane-${{ steps.compile-cache-key.outputs.fingerprint }}-

      - name: 🧪 Run the lane
        timeout-minutes: *work-timeout
        # The token is what the `github-api` capability hands to the suites
        # that declared it, so only this step holds it. The lane takes it out
        # of its own environment before it starts anything, so no other child
        # of the lane inherits it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A process in the lane that crashes natively leaves its core under
        # the job's temporary directory, where the upload of what a failing
        # lane left behind finds it. The arguments are a list of words, and
        # splitting them is the point.
        run: |
          mkdir -p "$RUNNER_TEMP/ci-lane-cores"
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/ci-lane-cores/core.%e.%p"
          # shellcheck disable=SC2086
          deno run -A tasks/ci-lane.ts $LANE_ARGS --described

      - name: 📋 Upload what a failing lane left behind
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lane-failure-${{ github.job }}-${{ matrix.lane }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-lane-*
          retention-days: 14
          if-no-files-found: ignore

      # The whole of what the lane converted, rather than its reports alone:
      # a measured set the lane saw fail is marked by a file beside its
      # report, and the file saying whether the compile cache was restored
      # sits beside the reports. A re-run of the lane replaces what the
      # attempt before it uploaded, so Status reads each lane once.
      #
      # An artifact is rooted at the directory its paths share, and the
      # readers find a set's report by the layout under the coverage
      # directory, so the paths name that directory and leave out the raw
      # profiles below it rather than naming the reports' own directory.
      - name: 📤 Upload the lane's coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lane-coverage-${{ github.job }}-${{ matrix.lane }}
          path: |
            coverage/
            !coverage/raw/
          overwrite: true
          retention-days: 90
          if-no-files-found: ignore

      # The lane has already gathered every batch's records into its spool and
      # marked each with its suite's variant, so this carries no variant and
      # no JUnit specification of its own.
      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: ${{ github.job }}-${{ matrix.lane }}
          job: ${{ env.LANE_JOB }}

  # ---------------------------------------------------------------------------
  # After the lanes. Status reads what every lane of the run produced, so it is
  # the one job that waits for them all, and the checks over the whole run's
  # records and coverage are its steps rather than jobs of their own.
  # ---------------------------------------------------------------------------

  status:
    name: "Status"
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'push')
    needs:
      - plan-full
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    # The coverage gate reads the pull request's description as it stands,
    # which is where an acceptance is written.
    permissions:
      contents: read
      pull-requests: read
    # The coverage report writes the run's coverage figures into this spool as
    # measurements, which the shipping step sends to the record store.
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The coverage gate diffs against the merge base, and asks git which
        # of the baselines' commits the branch contains. A checkout too
        # shallow to answer would report every set as having no baseline.
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 📥 Download the lanes' coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lane-coverage-*
          path: lane-coverage
          merge-multiple: false
          digest-mismatch: error

      - name: 📥 Download the lanes' test records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-records-*
          path: test-records-artifacts
          merge-multiple: false
          digest-mismatch: error

      # The store half of the test-topology drift guard. The tree half, a
      # repository gate the lanes run, fails a surface in the working tree
      # that no suite claims; this fails one that is registered and whose
      # records do not map back to the topology, which would leave those tests
      # running in the full run and never selectable on a pull request. It
      # judges a tree by the records that tree produced, so it reads this
      # run's records and holds them to this run's commit. No lane can run it:
      # a lane's records have not shipped when its gates run. It is handed the
      # directory rather than a list of files, so a run whose records it cannot
      # find fails rather than checking nothing.
      - name: 🔎 Check the topology against this run's records
        if: ${{ !cancelled() }}
        timeout-minutes: *work-timeout
        run: >-
          deno task check-test-topology --commit "$GITHUB_SHA"
          --records test-records-artifacts

      # Coverage measured through a failing run says nothing about whether the
      # change was tested, so a run whose tests did not pass is reported
      # rather than gated. The description is read as it stands rather than
      # from the event, since a re-run repeats the event it was started by,
      # and an acceptance written after the push is what a re-run is for.
      - name: 🔎 Hold the measured sets to their baselines
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        timeout-minutes: *work-timeout
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULTS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')
          args=(--base "origin/$BASE_REF" --reports lane-coverage
            --body "$body" --comment coverage-comment.json --pr "$PR_NUMBER")
          if [[ "$(jq -r '.tests.result' <<< "$JOB_RESULTS")" != success ]]; then
            args+=(--tests-failed)
          fi
          deno run -A tasks/coverage-gate.ts "${args[@]}"

      # A fork's pull request gets a read-only token here, so the gate writes
      # the comment it wants posted to an artifact, and the Pull Request
      # Comments workflow posts it from the base repository's context.
      - name: 📤 Upload coverage comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-comment
          path: coverage-comment.json
          overwrite: true
          retention-days: 7
          if-no-files-found: ignore

      # What the full run measured: the repository-wide figure, which is a
      # trend, and each measured set's figure, which is the baseline a pull
      # request is held to. Nothing here fails the run.
      - name: 📊 Report the run's coverage
        if: ${{ !cancelled() && github.event_name == 'push' }}
        timeout-minutes: *work-timeout
        run: deno run -A tasks/coverage-report.ts --reports lane-coverage

      # The run's coverage measurements, for the dashboard's trend and the
      # test-selection publisher, which read them from the record store, and
      # for the run report, which reads them from this run's artifacts. Only
      # a push ships them, because every reader takes a figure from a push to
      # main alone. This job runs no test, so it ships nothing else.
      - name: 📤 Ship test records
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: ./.github/actions/test-records-ship
        with:
          artifact: coverage
          job: Status

      # Skipped is success for every job but the lanes: a run whose lanes
      # were skipped would otherwise pass having run no test at all, so that
      # is asserted rather than left to the conditions on the lanes.
      - name: 🔎 Verify the run's jobs
        if: always()
        timeout-minutes: *work-timeout
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"
          ' <<< "$JOB_RESULTS")
          if [[ -n "$failures" ]]; then
            printf 'Unsuccessful jobs:\n%s\n' "$failures"
            exit 1
          fi
          if [[ "$(jq -r '.tests.result' <<< "$JOB_RESULTS")" != success ]]; then
            echo "The lanes did not pass."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The release. A push to main builds the binaries it ships while the lanes
  # run, and attests and deploys them only once every test has passed. A pull
  # request builds nothing here: the `binaries` suites compile each binary the
  # way this does, as a test that it still compiles.
  # ---------------------------------------------------------------------------

  build-toolshed:
    name: "Build Binary (toolshed)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # The co-presence endpoint the shell EMBEDDED IN THIS BINARY offers to
      # collaborative editors. `SHELL_PRESENCE_URL` is the repository variable
      # holding the value; `PRESENCE_URL` is the process variable
      # packages/shell/felt.config.ts reads and bakes in as the
      # `$PRESENCE_URL` define — the same mapping deploy-shell-staging makes
      # for the bucket shell, from its own variable. This binary is the one
      # both estuary and rapids deploy, so both carry whatever is baked here,
      # and changing the variable takes a rebuild before it reaches either.
      # Unset omits the define and co-presence stays disabled, which is why
      # this does not fail the way an unset API URL does: a shell with no
      # presence endpoint is a working shell. The job then succeeds either way,
      # so which of the two shells a binary carries would leave no trace in it;
      # the step says which, and the log is where that answer is.
      - name: 🔎 Validate the embedded shell's presence endpoint
        timeout-minutes: *work-timeout
        env:
          PRESENCE_URL: ${{ vars.SHELL_PRESENCE_URL }}
        run: |
          if [ -n "$PRESENCE_URL" ]; then
            # `deno eval` holds every permission implicitly, so the module read
            # and the environment lookup need no flags; the subcommand takes no
            # `--allow-read` or `--allow-env` and fails on either as an unknown
            # argument. What reaches GITHUB_ENV is `URL.href`, so it is the
            # normalized spelling the bundle carries and the grep below matches.
            PRESENCE_URL="$(deno eval '
              import { optionalPresenceUrl } from "./packages/shell/src/lib/presence-url.ts";
              console.log(optionalPresenceUrl(Deno.env.get("PRESENCE_URL"))?.href ?? "");
            ')"
            echo "PRESENCE_URL=$PRESENCE_URL" >> "$GITHUB_ENV"
            echo "The embedded shell gets presence service $PRESENCE_URL."
          else
            echo "SHELL_PRESENCE_URL is unset: the embedded shell gets no presence endpoint, so editor co-presence is off in every deployment of this binary."
          fi

      - name: 🏗️ Build toolshed binary
        timeout-minutes: *work-timeout
        run: |
          deno task build-binaries toolshed

          # shell-frontend is what the binary serves in production. An endpoint
          # that was configured but did not reach the bundle would deploy a
          # shell whose co-presence is silently off, and nothing downstream
          # looks, so confirm the define landed before the binary is uploaded.
          if [ -n "$PRESENCE_URL" ] && \
            ! grep -rqF -e "$PRESENCE_URL" packages/toolshed/shell-frontend/scripts; then
            echo "::error::The embedded shell does not reference $PRESENCE_URL."
            exit 1
          fi
        env:
          COMMIT_SHA: ${{ github.sha }}

      - name: 📤 Upload toolshed binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-toolshed
          path: ./dist/toolshed
          if-no-files-found: error

  # The `cf` binary a push releases. Only the Toolshed binary embeds a
  # shell, so this build has none of the endpoint checks that one makes.
  build-cf:
    name: "Build Binary (cf)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 🏗️ Build cf binary
        timeout-minutes: *work-timeout
        run: deno task build-binaries cf

      - name: 📤 Upload cf binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-cf
          path: ./dist/cf
          if-no-files-found: error

  attest-binaries:
    name: "Attest and Upload Binaries"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    # A release artifact must not outlive a failing test, the
    # `pattern-compat`, `pattern-vintage` and `deployed-topology` suites among
    # them.
    # Production deploys consume this artifact without rerunning anything, so
    # this waits for the whole of the full run as well as for the builds.
    # The full run's servers are built by the lanes from the same sources and
    # the same build task, without the commit and the shell endpoints this
    # job's binaries carry; what these binaries add is checked by the steps
    # that build them.
    needs: ["build-toolshed", "build-cf", "tests"]
    environment: ci
    permissions:
      id-token: write
      contents: read
      actions: read
      attestations: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📥 Download toolshed binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-toolshed
          path: common-binaries

      - name: 📥 Download cf binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-cf
          path: common-binaries

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      # Merge every lane's LCOV reports into one line-coverage file with
      # repository-relative paths, so IDE users can download a single artifact
      # covering the whole repository. Uploaded to Cloud Storage below alongside
      # the signed binaries. Best-effort: a coverage problem must not block
      # binary attestation or the deploys that depend on it.
      - name: 📥 Download coverage reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lane-coverage-*
          path: coverage-artifacts

      - name: 🧬 Combine coverage LCOV
        timeout-minutes: *work-timeout
        continue-on-error: true
        run: |
          deno run --allow-read --allow-write tasks/combine-coverage-lcov.ts \
            --input-dir=coverage-artifacts \
            --output=release/labs-${{ github.sha }}.lcov \
            --repo-name=${{ github.event.repository.name }}

      - name: 🔐 Process & sign binaries
        timeout-minutes: *work-timeout
        run: |
          mkdir -p release
          mkdir -p signed

          mv ./common-binaries ./dist

          # Process toolshed binary
          echo "Processing binary: toolshed"
          sha256sum ./dist/toolshed > ./dist/toolshed.hash.txt
          TOOLSHED_HASH=$(cat ./dist/toolshed.hash.txt | awk '{print $1}')
          echo "toolshed hash: $TOOLSHED_HASH"
          echo "toolshed_hash=$TOOLSHED_HASH" >> $GITHUB_OUTPUT

          # Sign the toolshed binary
          openssl dgst -sha256 -sign <(echo "${{ secrets.ARTIFACT_SIGNING_KEY }}") -out ./dist/toolshed.sig ./dist/toolshed

          # Copy to signed directory
          cp ./dist/toolshed ./signed/
          cp ./dist/toolshed.sig ./signed/

          # Process cf binary
          echo "Processing binary: cf"
          sha256sum ./dist/cf > ./dist/cf.hash.txt
          CF_HASH=$(cat ./dist/cf.hash.txt | awk '{print $1}')
          echo "cf hash: $CF_HASH"
          echo "cf_hash=$CF_HASH" >> $GITHUB_OUTPUT

          # Sign the cf binary
          openssl dgst -sha256 -sign <(echo "${{ secrets.ARTIFACT_SIGNING_KEY }}") -out ./dist/cf.sig ./dist/cf

          # Copy to signed directory
          cp ./dist/cf ./signed/
          cp ./dist/cf.sig ./signed/

          # Create a single tarball with all binaries and signatures
          tar -czf release/labs-${{ github.sha }}.tar.gz -C signed .

          # Generate hash for the tarball
          sha256sum release/labs-${{ github.sha }}.tar.gz > release/labs-${{ github.sha }}.hash.txt
          TARBALL_HASH=$(cat release/labs-${{ github.sha }}.hash.txt | awk '{print $1}')
          echo "Tarball hash: $TARBALL_HASH"
          echo "tarball_hash=$TARBALL_HASH" >> $GITHUB_OUTPUT
        id: binary_processing

      - name: 📝 Generate attestation for toolshed binary
        id: attest_toolshed
        timeout-minutes: *work-timeout
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ./dist/toolshed
          subject-digest: sha256:${{ steps.binary_processing.outputs.toolshed_hash }}

      - name: 📝 Generate attestation for cf binary
        id: attest_cf
        timeout-minutes: *work-timeout
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ./dist/cf
          subject-digest: sha256:${{ steps.binary_processing.outputs.cf_hash }}

      - name: 📝 Generate attestation for tarball
        id: attest_tarball
        timeout-minutes: *work-timeout
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: https://storage.cloud.google.com/commontools-build-artifacts/workspace-artifacts/labs-${{ github.sha }}.tar.gz
          subject-digest: sha256:${{ steps.binary_processing.outputs.tarball_hash }}

      - name: 📤 Upload attestations as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary_attestations
          if-no-files-found: error
          path: |
            ${{ steps.attest_toolshed.outputs.bundle-path }}
            ${{ steps.attest_cf.outputs.bundle-path }}
            ${{ steps.attest_tarball.outputs.bundle-path }}

      - name: 🔎 Verify binary attestations
        timeout-minutes: *work-timeout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A subject whose attestation does not verify fails the step: the
          # command substitution hands `bash -e` the exit status of `gh`.
          for subject in release/labs-${{ github.sha }}.tar.gz ./dist/toolshed ./dist/cf; do
            details=$(gh attestation verify "$subject" -R ${{ github.repository }} --format json)
            echo "::group::$subject attestation details"
            jq . <<< "$details"
            echo "::endgroup::"
            echo -e "\033[32m✓ $subject attestation verified successfully\033[0m"
          done

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69 # v1.3.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ⚙️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@e30db14379863a8c79331b04a9969f4c1e225e0b # v1.1.1

      # A release artifact is named after the commit it was built from, and a
      # host keeps whatever it has already downloaded under that name. So the
      # first build of a commit publishes the artifact and a later build of the
      # same commit leaves it alone. Two builds of one commit do not produce the
      # same bytes: the binaries are compiled again, and `tar` records
      # modification times.
      #
      # The tarball and its checksum are published as a pair. A commit that has
      # one of them and not the other was published by a build that stopped
      # between the two copies, and this publishes both of them again. See "One
      # commit, one set of artifacts" in docs/development/deploying.md.
      - name: 📤 Upload artifacts to Google Cloud Storage
        run: |
          BUCKET=gs://commontools-build-artifacts/workspace-artifacts
          TARBALL=labs-${{ github.sha }}.tar.gz
          CHECKSUM=labs-${{ github.sha }}.hash.txt

          if gsutil -q stat "$BUCKET/$TARBALL" && gsutil -q stat "$BUCKET/$CHECKSUM"; then
            echo "An earlier build of ${{ github.sha }} published its artifacts; leaving them as they are."
          else
            gsutil cp "release/$TARBALL" "$BUCKET/"
            gsutil cp "release/$CHECKSUM" "$BUCKET/"
          fi

          # Print clickable links to the published files
          echo "::group::📦 Artifact Links"
          echo "Tarball URL: https://storage.cloud.google.com/commontools-build-artifacts/workspace-artifacts/labs-${{ github.sha }}.tar.gz"
          echo "Hash URL: https://storage.cloud.google.com/commontools-build-artifacts/workspace-artifacts/labs-${{ github.sha }}.hash.txt"

          # The combined coverage report is best-effort; upload it only if the
          # combine step produced it. To download it for a given commit:
          #   gsutil cp gs://commontools-build-artifacts/workspace-artifacts/labs-<commit-sha>.lcov .
          if [ -f release/labs-${{ github.sha }}.lcov ]; then
            gsutil cp "release/labs-${{ github.sha }}.lcov" "$BUCKET/"
            echo "Coverage LCOV URL: https://storage.cloud.google.com/commontools-build-artifacts/workspace-artifacts/labs-${{ github.sha }}.lcov"
          fi
          echo "::endgroup::"

  # Automatic deployment to staging (rapids)
  deploy-rapids:
    name: "Deploy to Rapids (Staging)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ["attest-binaries"]
    runs-on: ubuntu-latest
    environment: toolshed
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup
        with:
          cache: false

      - name: 🚀 Deploy application to Rapids (Staging)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: bastion
          key: ${{ secrets.BASTION_SSH_PRIVATE_KEY }}
          script: /opt/cf/deploy.sh rapids ${{ github.sha }}

  # Deploy shell static assets to staging GCS bucket
  deploy-shell-staging:
    name: "Deploy Shell to Staging"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ["tests"]
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # STAGING_SHELL_API_URL names the API host this shell talks to, which is
      # the host the deploy-rapids job above keeps current. It is a variable
      # rather than a secret because it is served in plaintext inside the
      # bundle, and because the checks below can then name it when they fail.
      - name: 🔎 Validate staging shell endpoints
        env:
          API_URL: ${{ vars.STAGING_SHELL_API_URL }}
          PRESENCE_URL: ${{ vars.STAGING_SHELL_PRESENCE_URL }}
        run: |
          # An empty API_URL builds a shell that falls back to its own origin,
          # which serves static assets and no API. Require a value up front, so
          # the build never runs with nothing to point at.
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL is empty: the STAGING_SHELL_API_URL variable is unset."
            exit 1
          fi
          if [ -n "$PRESENCE_URL" ]; then
            PRESENCE_URL="$(deno eval '
              import { optionalPresenceUrl } from "./packages/shell/src/lib/presence-url.ts";
              console.log(optionalPresenceUrl(Deno.env.get("PRESENCE_URL"))?.href ?? "");
            ')"
            echo "PRESENCE_URL=$PRESENCE_URL" >> "$GITHUB_ENV"
          fi

      - name: 🏗️ Build shell with staging API URL
        working-directory: packages/shell
        run: |
          deno task production

          # The build substitutes API_URL into the bundle in place of the
          # `$API_URL` token. Confirm it landed before anything is uploaded.
          if ! grep -rqF -e "$API_URL" dist/scripts; then
            echo "::error::The built shell does not reference $API_URL."
            exit 1
          fi
          if [ -n "$PRESENCE_URL" ] && ! grep -rqF -e "$PRESENCE_URL" dist/scripts; then
            echo "::error::The built shell does not reference $PRESENCE_URL."
            exit 1
          fi
        env:
          API_URL: ${{ vars.STAGING_SHELL_API_URL }}
          COMMIT_SHA: ${{ github.sha }}

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69 # v1.3.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ⚙️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@e30db14379863a8c79331b04a9969f4c1e225e0b # v1.1.1

      - name: 📤 Upload shell assets to Staging GCS
        run: |
          # Retain the complete immutable module graph for long-lived pages.
          gsutil -m rsync -r packages/shell/dist gs://staging-commontools-dev/builds/${{ github.sha }}/

          # Upload to bucket root as "latest" (-d removes orphaned files)
          gsutil -m rsync -r -d packages/shell/dist gs://staging-commontools-dev/

          echo "📦 Staging Shell deployed"
          echo "https://staging.commontools.dev/"

      - name: 🔎 Verify the published shell targets the staging API
        env:
          API_URL: ${{ vars.STAGING_SHELL_API_URL }}
        run: |
          # Read the scripts back out of the bucket, so this checks the uploaded
          # objects rather than the local build directory. Going to the bucket
          # rather than to the site's own URL also bypasses the CDN, which may
          # still be serving the previous build.
          gsutil cat "gs://staging-commontools-dev/scripts/*.js" > published-scripts.js
          if ! grep -qF -e "$API_URL" published-scripts.js; then
            echo "::error::The published shell does not reference $API_URL."
            exit 1
          fi
          echo "Published shell targets $API_URL"
          if [ -n "$PRESENCE_URL" ] && ! grep -qF -e "$PRESENCE_URL" published-scripts.js; then
            echo "::error::The published shell does not reference $PRESENCE_URL."
            exit 1
          fi
          if [ -n "$PRESENCE_URL" ]; then
            echo "Published shell targets presence service $PRESENCE_URL"
          fi
