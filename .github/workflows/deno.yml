      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 🧮 Resolve the compiler fingerprint
        id: compile-cache-key
        uses: ./.github/actions/compile-cache-key

      - name: ♻️ Restore/save pattern unit compile byte cache
        id: compile-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.compile-cache/pattern-unit-coverage-${{ matrix.chunk }}.json
          key: cc-pattern-unit-coverage-${{ steps.compile-cache-key.outputs.fingerprint }}-${{ matrix.total }}-${{ matrix.chunk }}-${{ hashFiles('packages/patterns/**/*.ts', 'packages/patterns/**/*.tsx', 'packages/connectors/agents/debug-view/**/*.ts', 'packages/connectors/agents/debug-view/**/*.tsx', 'packages/connectors/github/activity-view/**/*.ts', 'packages/connectors/github/activity-view/**/*.tsx', 'packages/connectors/pattern-sources.ts', 'tasks/integration.ts', 'tasks/pattern-files.ts') }}
          restore-keys: |
            cc-pattern-unit-coverage-${{ steps.compile-cache-key.outputs.fingerprint }}-${{ matrix.total }}-${{ matrix.chunk }}-

      - name: 🧾 Record compile cache state for the Coverage Check
        uses: ./.github/actions/record-compile-cache-state
        with:
          family: pattern-unit
          shard: ${{ matrix.chunk }}
          cache-file: ${{ github.workspace }}/.compile-cache/pattern-unit-coverage-${{ matrix.chunk }}.json
          exact-hit: ${{ steps.compile-cache.outputs.cache-hit }}

      - name: 📥 Download cf binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-cf
          path: common-binaries

      - name: 🧪 Run pattern unit tests
        timeout-minutes: *work-timeout
        run: |
          chmod +x ./common-binaries/cf
          mkdir -p test-results .compile-cache coverage/lcov/pattern-runtime/pattern-unit-${{ matrix.chunk }}
          DENO_COVERAGE_DIR=coverage/raw/pattern-unit-${{ matrix.chunk }} \
          CF_PATTERN_COVERAGE_DIR=coverage/lcov/pattern-runtime/pattern-unit-${{ matrix.chunk }} \
          CF_COMPILE_CACHE_FILE="${{ github.workspace }}/.compile-cache/pattern-unit-coverage-${{ matrix.chunk }}.json" \
          CF_BINARY=./common-binaries/cf \
          deno task integration --junit-dir=test-results pattern-tests ${{ matrix.chunk }}/${{ matrix.total }}

      - name: 🧾 Write coverage report
        if: always()
        run: deno run --allow-read --allow-write --allow-run tasks/write-coverage-lcov.ts coverage/raw/pattern-unit-${{ matrix.chunk }} coverage/lcov/pattern-unit-${{ matrix.chunk }}.lcov

      - name: 📤 Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-profile-pattern-unit-${{ matrix.chunk }}
          path: coverage/lcov/
          retention-days: 90
          if-no-files-found: error

      - name: 📤 Upload test timing data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timing-pattern-unit-${{ matrix.chunk }}
          path: test-results/
          retention-days: 90
          if-no-files-found: ignore

      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: pattern-unit-${{ matrix.chunk }}
          job: Pattern Unit Tests (${{ matrix.chunk }}/${{ matrix.total }})
          shard: ${{ matrix.chunk }}/${{ matrix.total }}

  # These gates exercise production construction paths with the flag unset:
  # the toolshed binary and cf-harness's fabric-session factory. Their
  # expectations follow the same first-party default constant.
  deployed-topology-gate:
    name: "Deployed Topology Posture Gates"
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    needs: ["build-toolshed"]
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 🧭 Resolve default server-execution posture
        timeout-minutes: *posture-probe-timeout
        run: deno run tasks/server-execution-ci-command.ts env default >> "$GITHUB_ENV"

      - name: 📥 Download toolshed binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-toolshed
          path: common-binaries

      - name: 🔌 Start Toolshed server for testing
        env:
          TOOLSHED_PORT: 8000
        run: |
          chmod +x ./common-binaries/toolshed
          # --background waits until the server has bound its port before it
          # returns. The flag stays unset so the gates exercise the default.
          CFTS_AI_GATEWAY_URL="" \
          CFTS_AI_LLM_ANTHROPIC_API_KEY=fake \
          ./common-binaries/toolshed --port="$TOOLSHED_PORT" \
            --background --log-file="$RUNNER_TEMP/toolshed.log"

      - name: ✅ Verify the default server-execution posture
        timeout-minutes: *posture-probe-timeout
        env:
          TOOLSHED_PORT: 8000
        run: deno run --allow-net tasks/server-execution-ci-command.ts probe default "http://localhost:${TOOLSHED_PORT}"

      - name: 🧪 Run cf-harness posture gate
        timeout-minutes: *work-timeout
        working-directory: packages/cf-harness
        env:
          API_URL: http://localhost:8000
        run: |
          mkdir -p ../../test-results
          deno test --shuffle=$(deno task -q test-seed) --no-check \
            --junit-path=../../test-results/cf-harness-posture-gate.xml \
            -A \
            integration/fabric-session-posture-gate.test.ts

      - name: 📋 Upload toolshed log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolshed-log-deployed-topology-gate
          path: ${{ runner.temp }}/toolshed.log
          retention-days: 14
          if-no-files-found: ignore

      - name: 📤 Ship test records
        if: always()
        uses: ./.github/actions/test-records-ship
        with:
          artifact: deployed-topology-gate
          job: Deployed Topology Posture Gates
          junit: >-
            kind=integration,scope=cf-harness,prefix=packages/cf-harness,glob=test-results/cf-harness-posture-gate.xml

  # ---------------------------------------------------------------------------
  # Tier 2 – Post-test gates and deployments
  # ---------------------------------------------------------------------------

  coverage-check:
    name: "Coverage Check"
    if: (github.event_name == 'pull_request') || (github.event_name == 'push' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    needs:
      - check
      - test
      - build-toolshed
      - build-cf
      - package-integration-test
      - cli-integration-test
      - pattern-integration-test
      # Whichever pattern lane resolves OFF carries authored-pattern coverage.
      - pattern-integration-test-server-execution-opposite
      - pattern-reload-integration-test
      - pattern-unit-test
      - generated-patterns-integration-test
      - runner-test
    permissions:
      contents: read
      actions: read
      # Read-only: fork PRs get a read-only token here regardless, so the gate
      # only writes the comment to an artifact. The coverage-comment workflow
      # posts it from the base-repo context with a write token.
      pull-requests: read
    # The check writes the run's coverage figures into this spool as
    # measurements, which the last step ships to the record store.
    env:
      CF_TEST_RECORDS_DIR: ${{ github.workspace }}/test-records-spool
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 📥 Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-profile-*
          path: coverage-artifacts
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error

      # The gate reads the coverage artifacts of every test job in this run, so
      # no lane can be asked to run it and this job writes no test records:
      # what it ships is the run's coverage measurements alone.
      # `docs/specs/test-records.md` under "Recording" holds the criterion.
      - name: 📊 Run coverage check
        timeout-minutes: *work-timeout
        env:
          COVERAGE_ARTIFACTS_DIR: coverage-artifacts
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          deno run --allow-net --allow-env --allow-read --allow-run
          --allow-write tasks/coverage-check.ts

      - name: 📤 Upload coverage regression comment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-comment
          path: coverage-comment.json
          retention-days: 7
          if-no-files-found: ignore

      # The per-run coverage baseline (this run's coverage-debt metrics and
      # compile cache states). Named perf-metrics for historical continuity —
      # the coverage ratchet reads recent main runs' artifacts by this name, so
      # keeping it avoids a baseline migration.
      - name: 📤 Upload coverage baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-metrics
          path: perf-metrics.json
          retention-days: 90
          if-no-files-found: ignore

      # The run's coverage measurements, for the dashboard's trend and the
      # test-selection publisher, which read it from the record store, and
      # for the run report, which reads it from this run's artifacts. Only a
      # push ships one, because every reader takes a figure from a push to
      # main alone.
      - name: 📤 Ship test records
        if: always() && github.event_name == 'push'
        uses: ./.github/actions/test-records-ship
        with:
          artifact: coverage
          job: Coverage Check

  # The store half of the test-topology drift guard. The tree half fails a
  # surface in the working tree that no suite claims; this fails one that is
  # registered and whose records do not map back to the topology, which
  # would leave those tests running in the full run and never selectable on
  # a pull request. It judges a tree by the records that tree produced, so
  # it waits for every job that ships them and holds them to this run's
  # commit. A gate inside a lane could not do it: a lane's records have not
  # shipped when its gates run.
  #
  # It runs on a pull request as well as on the default branch, because the
  # change that introduces this drift is the change to a suite, a runner,
  # or a test's name, and that change has a run of its own. What reaches
  # the default branch is then the pair of changes that were each claimed
  # separately and are not together, which no single pull request can see.
  test-topology-store-check:
    name: "Test Topology Store Check"
    if: (github.event_name == 'pull_request') || (github.event_name == 'push' && github.ref_name == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    needs:
      - check
      - cfcheck
      - pattern-compat
      - pattern-vintage
      - test
      - runner-test
      - generated-patterns-integration-test
      - package-integration-test
      - package-integration-test-server-execution-opposite
      - cli-integration-test
      - pattern-integration-test
      - pattern-integration-test-server-execution-opposite
      - pattern-reload-integration-test
      - pattern-unit-test
      - deployed-topology-gate
    permissions:
      contents: read
      actions: read
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      - name: 📥 Download test records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-records-*
          path: test-records-artifacts
          merge-multiple: false
          digest-mismatch: error

      # The guard reads the record artifacts of every job in this run, so no
      # lane can be asked to run it and this job writes no test records.
      # `docs/specs/test-records.md` under "Recording" holds the criterion.
      # It is handed the directory rather than a list of files, so a run
      # whose artifacts it cannot find fails rather than checking nothing.
      - name: 🔎 Check the topology against this run's records
        timeout-minutes: *work-timeout
        run: >-
          deno task check-test-topology --commit "$GITHUB_SHA"
          --records test-records-artifacts

  status:
    name: "Status"
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - check
      - cfcheck
      - pattern-compat
      - pattern-vintage
      - test
      - runner-test
      - build-toolshed
      - build-toolshed-opposite
      - build-cf
      - generated-patterns-integration-test
      - package-integration-test
      - package-integration-test-server-execution-opposite
      - cli-integration-test
      - pattern-integration-test
      - pattern-integration-test-server-execution-opposite
      - pattern-reload-integration-test
      - pattern-unit-test
      - deployed-topology-gate
      - coverage-check
      - test-topology-store-check
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    steps:
      - name: 🔎 Verify pull request jobs
        timeout-minutes: *work-timeout
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          failures=$(jq -r '
            to_entries[]
            | select(.value.result != "success")
            | "\(.key): \(.value.result)"
          ' <<< "$JOB_RESULTS")

          if [[ -n "$failures" ]]; then
            printf 'Unsuccessful pull request jobs:\n%s\n' "$failures"
            exit 1
          fi

  attest-binaries:
    name: "Attest and Upload Binaries"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: *job-timeout
    # A release artifact must not outlive a failed pattern-migration gate.
    # Production deploys consume this artifact without rerunning those gates.
    # The deployed-topology gate exercises the binaries this job attests at
    # the first-party default, so a binary that fails it must not deploy.
    needs:
      [
        "test",
        "check",
        "pattern-compat",
        "pattern-vintage",
        "build-toolshed",
        "build-cf",
        "runner-test",
        "pattern-integration-test",
        "pattern-reload-integration-test",
        "pattern-unit-test",
        "package-integration-test",
        "cli-integration-test",
        "generated-patterns-integration-test",
        "deployed-topology-gate",
      ]
    environment: ci
    permissions:
      id-token: write
      contents: read
      actions: read
      attestations: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📥 Download toolshed binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-toolshed
          path: common-binaries

      - name: 📥 Download cf binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-cf
          path: common-binaries

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      # Merge every job's LCOV report into one line-coverage file with
      # repository-relative paths, so IDE users can download a single artifact
      # covering the whole repository. Uploaded to Cloud Storage below alongside
      # the signed binaries. Best-effort: a coverage problem must not block
      # binary attestation or the deploys that depend on it.
      - name: 📥 Download coverage reports
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-profile-*
          path: coverage-artifacts

      - name: 🧬 Combine coverage LCOV
        timeout-minutes: *work-timeout
        continue-on-error: true
        run: |
          deno run --allow-read --allow-write tasks/combine-coverage-lcov.ts \
            --input-dir=coverage-artifacts \
            --output=release/labs-${{ github.sha }}.lcov \
            --repo-name=${{ github.event.repository.name }}

      - name: 🔐 Process & sign binaries
        timeout-minutes: *work-timeout
        run: |
          mkdir -p release
          mkdir -p signed

          mv ./common-binaries ./dist

          # Process toolshed binary
          echo "Processing binary: toolshed"
          sha256sum ./dist/toolshed > ./dist/toolshed.hash.txt
          TOOLSHED_HASH=$(cat ./dist/toolshed.hash.txt | awk '{print $1}')
          echo "toolshed hash: $TOOLSHED_HASH"
          echo "toolshed_hash=$TOOLSHED_HASH" >> $GITHUB_OUTPUT

          # Sign the toolshed binary
          openssl dgst -sha256 -sign <(echo "${{ secrets.ARTIFACT_SIGNING_KEY }}") -out ./dist/toolshed.sig ./dist/toolshed

          # Copy to signed directory
          cp ./dist/toolshed ./signed/
          cp ./dist/toolshed.sig ./signed/

          # Process cf binary
          echo "Processing binary: cf"
          sha256sum ./dist/cf > ./dist/cf.hash.txt
          CF_HASH=$(cat ./dist/cf.hash.txt | awk '{print $1}')
          echo "cf hash: $CF_HASH"
          echo "cf_hash=$CF_HASH" >> $GITHUB_OUTPUT

          # Sign the cf binary
          openssl dgst -sha256 -sign <(echo "${{ secrets.ARTIFACT_SIGNING_KEY }}") -out ./dist/cf.sig ./dist/cf

          # Copy to signed directory
          cp ./dist/cf ./signed/
          cp ./dist/cf.sig ./signed/

          # Create a single tarball with all binaries and signatures
          tar -czf release/labs-${{ github.sha }}.tar.gz -C signed .

          # Generate hash for the tarball
          sha256sum release/labs-${{ github.sha }}.tar.gz > release/labs-${{ github.sha }}.hash.txt
          TARBALL_HASH=$(cat release/labs-${{ github.sha }}.hash.txt | awk '{print $1}')
          echo "Tarball hash: $TARBALL_HASH"
          echo "tarball_hash=$TARBALL_HASH" >> $GITHUB_OUTPUT
        id: binary_processing

      - name: 📝 Generate attestation for toolshed binary
        id: attest_toolshed
        timeout-minutes: *work-timeout
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ./dist/toolshed
          subject-digest: sha256:${{ steps.binary_processing.outputs.toolshed_hash }}

      - name: 📝 Generate attestation for cf binary
        id: attest_cf
        timeout-minutes: *work-timeout
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ./dist/cf
          subject-digest: sha256:${{ steps.binary_processing.outputs.cf_hash }}

      - name: 📝 Generate attestation for tarball
        id: attest_tarball
        timeout-minutes: *work-timeout
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: https://storage.cloud.google.com/commontools-build-artifacts/workspace-artifacts/labs-${{ github.sha }}.tar.gz
          subject-digest: sha256:${{ steps.binary_processing.outputs.tarball_hash }}

      - name: 📤 Upload attestations as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary_attestations
          if-no-files-found: error
          path: |
            ${{ steps.attest_toolshed.outputs.bundle-path }}
            ${{ steps.attest_cf.outputs.bundle-path }}
            ${{ steps.attest_tarball.outputs.bundle-path }}

      - name: 🔎 Verify binary attestations
        timeout-minutes: *work-timeout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A subject whose attestation does not verify fails the step: the
          # command substitution hands `bash -e` the exit status of `gh`.
          for subject in release/labs-${{ github.sha }}.tar.gz ./dist/toolshed ./dist/cf; do
            details=$(gh attestation verify "$subject" -R ${{ github.repository }} --format json)
            echo "::group::$subject attestation details"
            jq . <<< "$details"
            echo "::endgroup::"
            echo -e "\033[32m✓ $subject attestation verified successfully\033[0m"
          done

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69 # v1.3.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ⚙️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@e30db14379863a8c79331b04a9969f4c1e225e0b # v1.1.1

      # A release artifact is named after the commit it was built from, and a
      # host keeps whatever it has already downloaded under that name. So the
      # first build of a commit publishes the artifact and a later build of the
      # same commit leaves it alone. Two builds of one commit do not produce the
      # same bytes: the binaries are compiled again, and `tar` records
      # modification times.
      #
      # The tarball and its checksum are published as a pair. A commit that has
      # one of them and not the other was published by a build that stopped
      # between the two copies, and this publishes both of them again. See "One
      # commit, one set of artifacts" in docs/development/deploying.md.
      - name: 📤 Upload artifacts to Google Cloud Storage
        run: |
          BUCKET=gs://commontools-build-artifacts/workspace-artifacts
          TARBALL=labs-${{ github.sha }}.tar.gz
          CHECKSUM=labs-${{ github.sha }}.hash.txt

          if gsutil -q stat "$BUCKET/$TARBALL" && gsutil -q stat "$BUCKET/$CHECKSUM"; then
            echo "An earlier build of ${{ github.sha }} published its artifacts; leaving them as they are."
          else
            gsutil cp "release/$TARBALL" "$BUCKET/"
            gsutil cp "release/$CHECKSUM" "$BUCKET/"
          fi

          # Print clickable links to the published files
          echo "::group::📦 Artifact Links"
          echo "Tarball URL: https://storage.cloud.google.com/commontools-build-artifacts/workspace-artifacts/labs-${{ github.sha }}.tar.gz"
          echo "Hash URL: https://storage.cloud.google.com/commontools-build-artifacts/workspace-artifacts/labs-${{ github.sha }}.hash.txt"

          # The combined coverage report is best-effort; upload it only if the
          # combine step produced it. To download it for a given commit:
          #   gsutil cp gs://commontools-build-artifacts/workspace-artifacts/labs-<commit-sha>.lcov .
          if [ -f release/labs-${{ github.sha }}.lcov ]; then
            gsutil cp "release/labs-${{ github.sha }}.lcov" "$BUCKET/"
            echo "Coverage LCOV URL: https://storage.cloud.google.com/commontools-build-artifacts/workspace-artifacts/labs-${{ github.sha }}.lcov"
          fi
          echo "::endgroup::"

  # Automatic deployment to staging (rapids)
  deploy-rapids:
    name: "Deploy to Rapids (Staging)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ["attest-binaries"]
    runs-on: ubuntu-latest
    environment: toolshed
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup
        with:
          cache: false

      - name: 🚀 Deploy application to Rapids (Staging)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: bastion
          key: ${{ secrets.BASTION_SSH_PRIVATE_KEY }}
          script: /opt/cf/deploy.sh rapids ${{ github.sha }}

  # Deploy shell static assets to staging GCS bucket
  deploy-shell-staging:
    name: "Deploy Shell to Staging"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        "test",
        "check",
        "pattern-integration-test",
        "pattern-reload-integration-test",
        "pattern-unit-test",
        "package-integration-test",
        "cli-integration-test",
      ]
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🦕 Setup Deno
        uses: ./.github/actions/deno-setup

      - name: 🔍 Verify lock file & install dependencies
        uses: ./.github/actions/deno-install

      # STAGING_SHELL_API_URL names the API host this shell talks to, which is
      # the host the deploy-rapids job above keeps current. It is a variable
      # rather than a secret because it is served in plaintext inside the
      # bundle, and because the checks below can then name it when they fail.
      - name: 🔎 Validate staging shell endpoints
        env:
          API_URL: ${{ vars.STAGING_SHELL_API_URL }}
          PRESENCE_URL: ${{ vars.STAGING_SHELL_PRESENCE_URL }}
        run: |
          # An empty API_URL builds a shell that falls back to its own origin,
          # which serves static assets and no API. Require a value up front, so
          # the build never runs with nothing to point at.
          if [ -z "$API_URL" ]; then
            echo "::error::API_URL is empty: the STAGING_SHELL_API_URL variable is unset."
            exit 1
          fi
          if [ -n "$PRESENCE_URL" ]; then
            PRESENCE_URL="$(deno eval '
              import { optionalPresenceUrl } from "./packages/shell/src/lib/presence-url.ts";
              console.log(optionalPresenceUrl(Deno.env.get("PRESENCE_URL"))?.href ?? "");
            ')"
            echo "PRESENCE_URL=$PRESENCE_URL" >> "$GITHUB_ENV"
          fi

      - name: 🏗️ Build shell with staging API URL
        working-directory: packages/shell
        run: |
          deno task production

          # The build substitutes API_URL into the bundle in place of the
          # `$API_URL` token. Confirm it landed before anything is uploaded.
          if ! grep -rqF -e "$API_URL" dist/scripts; then
            echo "::error::The built shell does not reference $API_URL."
            exit 1
          fi
          if [ -n "$PRESENCE_URL" ] && ! grep -rqF -e "$PRESENCE_URL" dist/scripts; then
            echo "::error::The built shell does not reference $PRESENCE_URL."
            exit 1
          fi
        env:
          API_URL: ${{ vars.STAGING_SHELL_API_URL }}
          COMMIT_SHA: ${{ github.sha }}

      - name: 🔑 Authenticate to Google Cloud
        uses: google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69 # v1.3.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: ⚙️ Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@e30db14379863a8c79331b04a9969f4c1e225e0b # v1.1.1

      - name: 📤 Upload shell assets to Staging GCS
        run: |
          # Retain the complete immutable module graph for long-lived pages.
          gsutil -m rsync -r packages/shell/dist gs://staging-commontools-dev/builds/${{ github.sha }}/

          # Upload to bucket root as "latest" (-d removes orphaned files)
          gsutil -m rsync -r -d packages/shell/dist gs://staging-commontools-dev/

          echo "📦 Staging Shell deployed"
          echo "https://staging.commontools.dev/"

      - name: 🔎 Verify the published shell targets the staging API
        env:
          API_URL: ${{ vars.STAGING_SHELL_API_URL }}
        run: |
          # Read the scripts back out of the bucket, so this checks the uploaded
          # objects rather than the local build directory. Going to the bucket
          # rather than to the site's own URL also bypasses the CDN, which may
          # still be serving the previous build.
          gsutil cat "gs://staging-commontools-dev/scripts/*.js" > published-scripts.js
          if ! grep -qF -e "$API_URL" published-scripts.js; then
            echo "::error::The published shell does not reference $API_URL."
            exit 1
          fi
          echo "Published shell targets $API_URL"
          if [ -n "$PRESENCE_URL" ] && ! grep -qF -e "$PRESENCE_URL" published-scripts.js; then
            echo "::error::The published shell does not reference $PRESENCE_URL."
            exit 1
          fi
          if [ -n "$PRESENCE_URL" ]; then
            echo "Published shell targets presence service $PRESENCE_URL"
          fi
