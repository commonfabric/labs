name: "Cached Deno install"
description: >
  Install Deno project dependencies from the restored cache when it is complete.
  Fetch dependencies when the cache is incomplete.
inputs:
  frozen:
    description: "Pass --frozen to deno install."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: 📦 Install Deno dependencies
      shell: bash
      env:
        FROZEN: ${{ inputs.frozen }}
      run: |
        set -euo pipefail

        frozen_arg=()
        if [ "$FROZEN" = "true" ]; then
          frozen_arg=(--frozen=true)
        elif [ "$FROZEN" = "false" ]; then
          frozen_arg=(--frozen=false)
        else
          echo "::error::frozen must be true or false"
          exit 1
        fi

        binary_entrypoints=(
          packages/toolshed/index.ts
          packages/cli/mod.ts
        )

        if deno install --cached-only "${frozen_arg[@]}" &&
          deno install --entrypoint --cached-only "${frozen_arg[@]}" "${binary_entrypoints[@]}"; then
          echo "Deno dependencies are available in the local cache."
        else
          echo "Deno cache is incomplete; fetching dependencies."
          deno install "${frozen_arg[@]}"
          deno install --entrypoint "${frozen_arg[@]}" "${binary_entrypoints[@]}"
        fi

        echo "CF_DENO_DEPENDENCIES_INSTALLED=1" >> "$GITHUB_ENV"
