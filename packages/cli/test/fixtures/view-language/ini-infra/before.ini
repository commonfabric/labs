; NOTE: Rapids is the replacement host for toolshed.saga-castor.ts.net.
[all:vars]
ansible_python_interpreter=/usr/bin/python3
server_key_file=../secrets/toolshed-server-key.yml
toolshed_env_overrides={"ENV":"staging","MEMORY_DUMP_ENABLED":"true"}

; SSL Configuration
enable_selfsigned_ssl=true
https_port=8443

[toolshed]
rapids.saga-castor.ts.net ansible_user=deploy

[bastion]
bastion.saga-castor.ts.net ansible_user=jake
