<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Common Fabric · the CFC circuit — system map</title>
    <style>
    :root,
    [data-theme="dark"] {
      --bg: #0f1115;
      --grid: #1b1f28;
      --panel: #171a21;
      --panel-2: #1e222b;
      --line: #2b303b;
      --fg: #e6e8ee;
      --muted: #9aa3b2;
      --accent: #7dd3fc;
      --node: #1b1f28;
      --node-stroke: #454c5a;
      --node-hover: #242a36;
      --node-focus: #27303f;
      --gate-fill: #12151b;
      --ink: #0b0d11;
      --story-bg: rgba(23, 26, 33, 0.97);
      --outside: #fb7185;
      --tcb: #34d399;
      --tcb-tint: rgba(52, 211, 153, 0.06);
      --k-handle: #7dd3fc;
      --k-value: #e879f9;
      --k-labeled: #f1f5f9;
      --k-ingress: #fb7185;
      --k-control: #6b7280;
      --k-evidence: #a78bfa;
      --s-shipped: #22c55e;
      --s-partial: #f59e0b;
      --s-gap: #ef4444;
      --s-intended: #94a3b8;
      --dim: 0.22;
    }
    [data-theme="light"] {
      --bg: #f6f7f9;
      --grid: #e3e6eb;
      --panel: #ffffff;
      --panel-2: #eef1f5;
      --line: #d5dae2;
      --fg: #14181f;
      --muted: #5b6472;
      --accent: #0369a1;
      --node: #ffffff;
      --node-stroke: #8b94a3;
      --node-hover: #eef4ff;
      --node-focus: #e0efff;
      --gate-fill: #ffffff;
      --ink: #ffffff;
      --story-bg: rgba(255, 255, 255, 0.97);
      --outside: #e11d48;
      --tcb: #059669;
      --tcb-tint: rgba(5, 150, 105, 0.07);
      --k-handle: #0284c7;
      --k-value: #c026d3;
      --k-labeled: #111827;
      --k-ingress: #e11d48;
      --k-control: #6b7280;
      --k-evidence: #7c3aed;
      --s-shipped: #16a34a;
      --s-partial: #d97706;
      --s-gap: #dc2626;
      --s-intended: #64748b;
      --dim: 0.18;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font:
        14px/1.45 -apple-system,
        BlinkMacSystemFont,
        "Inter",
        "Segoe UI",
        Helvetica,
        Arial,
        sans-serif;
      overflow: hidden;
    }
    #app {
      display: grid;
      grid-template-columns: 1fr 400px;
      grid-template-rows: auto 1fr auto;
      height: 100%;
    }
    header {
      grid-column: 1 / 3;
      display: grid;
      gap: 6px 14px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    header h1 {
      font-size: 15px;
      margin: 0 10px 0 0;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    header h1 span {
      color: var(--muted);
      font-weight: 400;
    }
    .group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .group + .group {
      margin-left: 6px;
      padding-left: 12px;
      border-left: 1px solid var(--line);
    }
    .glabel {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-right: 4px;
    }
    button {
      background: var(--panel-2);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 5px 10px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
    }
    button.on {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--ink);
    }
    button.chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    button.chip .sw {
      width: 22px;
      height: 0;
      border-top: 3px solid currentColor;
      border-radius: 2px;
    }
    button.chip .sw.dash {
      border-top-style: dashed;
    }
    button.chip .sw.dot {
      border-top-style: dotted;
    }
    button.chip.off {
      opacity: 0.35;
    }
    #stage {
      grid-column: 1;
      grid-row: 2;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 1px) 0
        0 / 28px 28px,
        var(--bg);
      cursor: grab;
    }
    #stage.dragging {
      cursor: grabbing;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    aside {
      grid-column: 2;
      grid-row: 2 / 4;
      border-left: 1px solid var(--line);
      background: var(--panel);
      overflow: auto;
      padding: 18px;
      font-size: 15px;
    }
    aside h2 {
      font-size: 18px;
      margin: 8px 0 4px;
    }
    aside .kind {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      margin-right: 6px;
    }
    aside .kind.b-outside {
      border-color: var(--outside);
      color: var(--outside);
    }
    aside .kind.b-tcb {
      border-color: var(--tcb);
      color: var(--tcb);
    }
    aside .status {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      color: var(--ink);
      font-weight: 600;
      vertical-align: middle;
    }
    aside .status.shipped {
      background: var(--s-shipped);
    }
    aside .status.partial {
      background: var(--s-partial);
    }
    aside .status.gap {
      background: var(--s-gap);
      color: #fff;
    }
    aside .status.intended {
      background: var(--s-intended);
    }
    aside p {
      margin: 8px 0;
    }
    aside h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 18px 0 6px;
    }
    aside ul {
      margin: 0;
      padding-left: 18px;
    }
    aside li {
      margin: 5px 0;
    }
    aside code {
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--panel-2);
      padding: 1px 5px;
      border-radius: 4px;
    }
    aside a {
      color: var(--accent);
      text-decoration: none;
    }
    aside a:hover {
      text-decoration: underline;
    }
    aside .hint {
      color: var(--muted);
      font-size: 13px;
    }
    aside .bk {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 13px;
    }
    #story {
      grid-column: 1;
      border-top: 1px solid var(--line);
      background: var(--story-bg);
      padding: 12px 16px;
      display: none;
      gap: 14px;
      align-items: flex-start;
    }
    #story.on {
      display: flex;
    }
    #story .n {
      color: var(--accent);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      padding-top: 4px;
      min-width: 200px;
    }
    #story .n small {
      display: block;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0;
      margin-top: 4px;
    }
    #story .t {
      flex: 1;
      font-size: 15px;
    }
    #story .t b {
      display: block;
      margin-bottom: 3px;
      font-size: 17px;
    }
    #story .dots {
      display: flex;
      gap: 5px;
      margin-top: 8px;
    }
    #story .dots i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--line);
      display: block;
    }
    #story .dots i.on {
      background: var(--accent);
    }
    #story .nav {
      display: flex;
      gap: 6px;
    }
    #stage .hud {
      position: absolute;
      top: 10px;
      left: 12px;
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
    }

    /* SVG */
    .band-rect {
      fill: none;
      stroke-width: 1.5;
      rx: 18;
      stroke: var(--line);
    }
    .band-rect.outside {
      stroke: var(--outside);
      stroke-opacity: 0.55;
    }
    .band-rect.tcb {
      fill: var(--tcb-tint);
      stroke: var(--tcb);
      stroke-width: 2.5;
    }
    .band-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.05em;
      fill: var(--muted);
    }
    .band-title.outside {
      fill: var(--outside);
    }
    .band-title.tcb {
      fill: var(--tcb);
    }
    .band-sub {
      font-size: 18px;
      fill: var(--muted);
      font-weight: 400;
    }
    .group-rect {
      fill: none;
      stroke: var(--line);
      stroke-dasharray: 6 5;
      rx: 14;
    }
    .stamp {
      font-size: 22px;
      fill: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.04em;
    }
    .group-title {
      font-size: 14px;
      fill: var(--muted);
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .node {
      cursor: pointer;
    }
    .node rect {
      fill: var(--node);
      stroke: var(--node-stroke);
      stroke-width: 1.5;
      rx: 12;
    }
    .node.attach rect {
      stroke-dasharray: 5 4;
      fill: none;
    }
    .node .ic {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .node text {
      fill: var(--fg);
      font-size: 18px;
      font-weight: 600;
      pointer-events: none;
    }
    .node text.sub {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 400;
    }
    .node:hover rect,
    .node.sel rect {
      fill: var(--node-hover);
      stroke-width: 2.5;
    }
    .node.focus rect {
      fill: var(--node-focus);
      stroke: var(--accent);
      stroke-width: 3;
    }
    .node.focus .ic {
      stroke: var(--accent);
    }
    .edge path {
      fill: none;
      stroke-width: 3;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .edge.k-handle path {
      stroke: var(--k-handle);
      stroke-dasharray: 10 7;
    }
    .edge.k-value path {
      stroke: var(--k-value);
    }
    .edge.k-labeled path {
      stroke: var(--k-labeled);
      stroke-width: 3.5;
    }
    .edge.k-ingress path {
      stroke: var(--k-ingress);
    }
    .edge.k-control path {
      stroke: var(--k-control);
      stroke-width: 1.8;
    }
    .edge.k-evidence path {
      stroke: var(--k-evidence);
      stroke-dasharray: 2 7;
    }
    .edge text {
      font-size: 13px;
      fill: var(--muted);
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 5px;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .edge.focus path {
      stroke-width: 5;
    }
    .edge.focus text {
      fill: var(--fg);
    }
    .edge path.hit {
      stroke: transparent !important;
      stroke-width: 20;
      cursor: pointer;
      marker-start: none !important;
      marker-end: none !important;
      stroke-dasharray: none !important;
    }
    .gate {
      cursor: pointer;
    }
    .gate polygon {
      stroke-width: 3;
    }
    .gate.shipped polygon {
      fill: var(--s-shipped);
      stroke: var(--s-shipped);
    }
    .gate.partial polygon {
      fill: var(--s-partial);
      stroke: var(--s-partial);
    }
    .gate.gap polygon {
      fill: var(--gate-fill);
      stroke: var(--s-gap);
      stroke-width: 4;
    }
    .gate.intended polygon {
      fill: var(--gate-fill);
      stroke: var(--s-intended);
      stroke-dasharray: 5 4;
    }
    .gate .sh {
      fill: none;
      stroke-width: 2.2;
      stroke: var(--ink);
    }
    .gate.gap .sh {
      stroke: var(--s-gap);
    }
    .gate.intended .sh {
      stroke: var(--s-intended);
    }
    .gate text.lbl {
      font-size: 13px;
      fill: var(--fg);
      font-weight: 600;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 5px;
      pointer-events: none;
    }
    .gate text.st {
      font-size: 12px;
      font-weight: 500;
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 5px;
      pointer-events: none;
    }
    .gate.focus polygon {
      stroke: var(--accent);
      stroke-width: 5;
    }
    .threat {
      cursor: pointer;
    }
    .threat .mk {
      stroke: var(--bg);
      stroke-width: 2.5;
    }
    .threat.c-guarded .mk {
      fill: var(--s-shipped);
    }
    .threat.c-upcoming .mk {
      fill: var(--s-partial);
    }
    .threat.c-residual .mk {
      fill: var(--s-intended);
    }
    .threat .ring {
      fill: none;
      stroke: var(--s-gap);
      stroke-width: 2.5;
    }
    .threat .pg {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.6;
    }
    .threat text {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 800;
      pointer-events: none;
    }
    .threat.focus .mk {
      stroke: var(--accent);
      stroke-width: 4;
    }
    .threat.hidden {
      display: none;
    }
    .dim {
      opacity: var(--dim);
      filter: saturate(0.25);
    }
    /* level of detail by zoom */
    svg.z0 .edge text,
    svg.z0 .gate text.st,
    svg.z0 .node text.sub,
    svg.z0 .group-title,
    svg.z0 .band-sub {
      display: none;
    }
    svg.z1 .gate text.st {
      display: none;
    }
    .arrow {
      fill: currentColor;
    }
    </style>
  </head>

        `<p>Once the handle cell exists it is an ordinary same-space cell, so <code>--input-cell</code> and <code>/api/task inputCells</code> carry it into a harness session with no new transport. A console launched with <code>--instance</code> also grants it to every session it runs, without a caller attaching anything: the launcher joins Loom's injection receipt with its declared table contracts by piece, connection, and companion key. Each grant is named by its connection/store identity, with all declared CFC classes beside it: <code>gmail-work (email)</code> and a messaging store carrying both <code>message</code> and <code>call</code>. Connections sharing a class remain distinct; repeated receipts for the same store coalesce only when their references and class sets match. Conflicting references or classifications are refused. The session description also carries receipt account identity, physical row counts including metadata and history, and newest observation time when available. An unrecorded account identity, no account, and an empty store are distinct from unknown metadata; observation time is when Loom observed a record, not its content time.</p><p>An input on this path that does not read back as a handle settles as the query's own error rather than killing the reactive action, so the result carries the error for the pattern to render and a later pass can still succeed once the handle reads.</p>`,
      e_parent_child:
        `<p>Delegation seeds the child's handle table with the parent address entries and non-cell referents whose tokens the brief names or a selected current research kit declares as an input, and nothing else. The brief itself is prose.</p>`,
      e_child_parent:
        `<p>Return is validated, sanitized and re-minted through the parent's boundary. Raw child evidence is retained outside the parent's return channel. CT-2036 tracks inert numeric fields that can encode sealed strings; CT-2199 tracks program text and diagnostics crossing in the summary.</p>`,
      e_research:
        `<p><code>research</code> gives the parent and pattern-author child a bounded private CF research loop without opening another delegation depth. Fresh CLI root tasks and interactive sessions without retained research request an orientation through the ordinary tool-policy and artifact path before the first parent model turn. Once a chat has retained findings, it skips automatic orientation. The parent asks follow-up questions for what remains unclear, with the current user goal kept alongside each narrower task. The host inserts the admitted findings immediately before the task. A durable checkpoint recovers that handoff on resume without repeating research; delegated children consume the inherited kit and start no opening pass. Activity records identify the opening origin, and private usage contributes to the root total.</p><p>Its private tools return matching passages from the endorsed docs and skills corpus, list document outlines, read selected sections together, inspect published patterns with complete multi-file source and dependencies, and describe the safe shape of available general handles. They cannot execute, write, browse, delegate, or mutate Fabric. Attached patterns are leads that still require source inspection.</p><p>The host admits only exact-read citations, successfully described handle bindings, and patterns whose indexed source identity is verified or explicitly deferred for the one unsupported light-compiler case. A catalog of current reads supports synthesis and at most one tool-free citation repair within the existing turn budget; unread ids remain inadmissible. Direct-run examples must match the shared pattern-invocation schema and name an inspected pattern. Complete pattern-source examples receive a syntax-only parser result with exact diagnostics; parsing does not establish imports, types, compilation, or runtime behavior. Rules and examples have a complete exact-source catalog. Metadata reads obey the same 32,000-character limit as source windows.</p><p>Each result separately retains its full known source label, carries only confidentiality into later model context, and records every unavailable label as incomplete metadata coverage. The accounting includes unselected documentation leads and labels acquired with exact handle descriptions; it records gaps for unavailable handle metadata, legacy prior research, and the private pattern index, whose metadata and source expose no label and are never promoted to public because they are published. Source integrity remains provenance rather than authority over a model rewrite. A failed handle-label read retains its fail-closed restriction and reports unavailable classification. Opening handoff, resume, and child inheritance preserve confidentiality, even when no kit transfers.</p><p>The caller receives an orientation establishing a useful approach from available data and composable pieces, or an answer to a follow-up question. Both can inspect indexed source and return an optional code or invocation example within eight turns, twenty-four calls, and 96,000 read characters; exact contents, private transcript, budgets, and partial failure evidence stay in the tool artifact. One model projection scrubs kit prose, preserves exact import identities and source/CFC records, and leaves unused raw schemas in artifacts. The omission writer and auditor share one result-provenance reader. Context selection keeps the latest orientation and two answers. Private follow-ups receive selected findings and reopenable sources without old examples or bindings. Interactive history commits research and CFC context together. On provider failure the Loom host can retain the last validated resumable checkpoint, with matching research, CFC state and omission provenance; unpaired work remains audit evidence. Turn-local budget notices remain in audit artifacts but are excluded from session replay. Prior-task bindings remain historical. Only selected current declared bindings transfer handles. Child run state retains the selected raw kits, joined to projected context by research run id. <code>query_docs</code> survives only as a normalized legacy input alias.</p>`,
      e_skillssh:

    function pathD(pts, r = 14) {
      if (pts.length < 3) return "M" + pts.map((p) => p.join(",")).join(" L");
      let d = `M${pts[0][0]},${pts[0][1]}`;
      for (let i = 1; i < pts.length - 1; i++) {
        const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
        const d1 = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]),
          d2 = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
        const rr = Math.min(r, d1 / 2, d2 / 2);
        const a = [
          p1[0] + (p0[0] - p1[0]) / d1 * rr,
          p1[1] + (p0[1] - p1[1]) / d1 * rr,
        ];
        const b = [
          p1[0] + (p2[0] - p1[0]) / d2 * rr,
          p1[1] + (p2[1] - p1[1]) / d2 * rr,
        ];
        d += ` L${a[0]},${a[1]} Q${p1[0]},${p1[1]} ${b[0]},${b[1]}`;
      }
      const l = pts[pts.length - 1];
      d += ` L${l[0]},${l[1]}`;
      return d;
    }
    function along(pts, t) {
      const segs = [];
      let total = 0;
      for (let i = 1; i < pts.length; i++) {
        const L = Math.hypot(
          pts[i][0] - pts[i - 1][0],
          pts[i][1] - pts[i - 1][1],
        );
        segs.push(L);
        total += L;
      }
      let want = t * total;
      for (let i = 0; i < segs.length; i++) {
        if (want <= segs[i]) {
          const f = want / segs[i];
          return [
            pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f,
            pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f,
          ];
        }
        want -= segs[i];
      }
      return pts[pts.length - 1];

      t.textContent = n.t;
      const s = el("text", { class: "sub", x: 44, y: 54 }, g);
      s.textContent = n.s;
      (extraLines[n.id] || []).forEach((line, i) => {
        const x = el("text", { class: "sub", x: 14, y: 78 + i * 20 }, g);
        x.textContent = line;
      });
    }
    for (const e of edges) {
      if (e.gate) {
        const gd = gateDefs[e.gate];
        const [x, y] = along(edgePts[e.id], e.gt);
        const g = el("g", {
          class: "gate " + gd.status,
          "data-id": e.gate,
          transform: `translate(${x},${y})`,
        }, gGates);
        el("polygon", { points: "0,-24 24,0 0,24 -24,0" }, g);
        el("path", {
          class: "sh",
          d: "M0,-11 l8,3 v5 c0,5 -3.5,9 -8,11 c-4.5,-2 -8,-6 -8,-11 v-5 z",
          transform: "translate(0,1)",
        }, g);
        const l = el("text", {
          class: "lbl",
          "text-anchor": "middle",
          y: e.gabove ? -36 : 44,
        }, g);
        l.textContent = gd.t;
        const l2 = el("text", {
          class: "st",
          "text-anchor": "middle",
          y: e.gabove ? -52 : 60,
          "data-status": 1,
          style: `fill: var(--s-${gd.status})`,
        }, g);
        l2.textContent = gd.short;
      }
    }
    for (const t of threats) {
      const g = el("g", {
        class: "threat c-" + t.c,
        "data-id": t.id,
        transform: `translate(${t.x},${t.y})`,
      }, gThreats);
      el("polygon", {
        class: "ring",
        points: "0,-23 20,-11.5 20,11.5 0,23 -20,11.5 -20,-11.5",
      }, g);
      el("polygon", {
        class: "mk",
        points: "0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9",
      }, g);
      const tx = el("text", { "text-anchor": "middle", y: 5 }, g);
      tx.textContent = t.n;
      if (t.c === "residual") {
        const pg = el("g", {
          class: "pg",
          transform: "translate(11,-24) scale(.55)",
        }, g);
        pg.innerHTML = icons.person;
      }
    }

    // ------------------------------------------------------------------ pan / zoom
    const stage = document.getElementById("stage");
    let vb = { x: 0, y: 0, w: W, h: H };
    function applyVB() {
      svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
      const s = stage.getBoundingClientRect().width / vb.w;
      svg.classList.toggle("z0", s < 0.7);
      svg.classList.toggle("z1", s >= 0.7 && s < 1.05);
      svg.classList.toggle("z2", s >= 1.05);
    }
    function fit(pad = 40) {
      const r = stage.getBoundingClientRect();
      const s = Math.min(r.width / (W + pad * 2), r.height / (H + pad * 2));
      vb = {
        w: r.width / s,
        h: r.height / s,
        x: -pad - (r.width / s - W - pad * 2) / 2,
        y: -pad - (r.height / s - H - pad * 2) / 2,
      };
      applyVB();
    }
    function fitTo(ids, pad = 120) {
      const boxes = [];
      for (const id of ids) {
        const n = N[id];
        if (n) boxes.push([n.x, n.y, n.x + n.w, n.y + n.h]);
        const g = gGates.querySelector(`[data-id="${id}"]`);
        if (g) {
          const m = g.transform.baseVal.getItem(0).matrix;
          boxes.push([m.e - 70, m.f - 70, m.e + 70, m.f + 70]);
        }
        if (edgePts[id]) {
          for (const p of edgePts[id]) boxes.push([p[0], p[1], p[0], p[1]]);
        }
        const th = threats.find((t) => t.id === id);
        if (th) boxes.push([th.x - 24, th.y - 24, th.x + 24, th.y + 24]);
      }
      if (!boxes.length) return;
      const x0 = Math.min(...boxes.map((b) => b[0])) - pad,
        y0 = Math.min(...boxes.map((b) => b[1])) - pad,
        x1 = Math.max(...boxes.map((b) => b[2])) + pad,
        y1 = Math.max(...boxes.map((b) => b[3])) + pad;
      const r = stage.getBoundingClientRect();
      const s = Math.min(r.width / (x1 - x0), r.height / (y1 - y0), 0.9);
      const target = { w: r.width / s, h: r.height / s };
      target.x = (x0 + x1) / 2 - target.w / 2;
      target.y = (y0 + y1) / 2 - target.h / 2;
      animateTo(target);
    }
    let anim = null;
    function animateTo(t) {
      const from = { ...vb }, t0 = performance.now();
      cancelAnimationFrame(anim);
      const step = (now) => {
        const k = Math.min(1, (now - t0) / 420), e = 1 - Math.pow(1 - k, 3);
        vb = {
          x: from.x + (t.x - from.x) * e,
          y: from.y + (t.y - from.y) * e,
          w: from.w + (t.w - from.w) * e,
          h: from.h + (t.h - from.h) * e,
        };
        applyVB();
        if (k < 1) anim = requestAnimationFrame(step);
      };
      anim = requestAnimationFrame(step);
    }
    let drag = null;
    stage.addEventListener("pointerdown", (ev) => {
      drag = {
        x: ev.clientX,
        y: ev.clientY,
        vx: vb.x,
        vy: vb.y,
        moved: false,
        target: ev.target,
      };
      stage.classList.add("dragging");
      stage.setPointerCapture(ev.pointerId);
    });
    stage.addEventListener("pointermove", (ev) => {
      if (!drag) return;
      const r = stage.getBoundingClientRect();
      const s = vb.w / r.width;
      const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      vb.x = drag.vx - dx * s;
      vb.y = drag.vy - dy * s;
      applyVB();
    });
    stage.addEventListener("pointerup", (ev) => {
      const moved = drag && drag.moved;
      const tgt = drag && drag.target;
      drag = null;
      stage.classList.remove("dragging");
      if (!moved && tgt) {
        const t = tgt.closest("[data-id]");
        if (t) select(t.dataset.id);
      }
    });
    stage.addEventListener("wheel", (ev) => {
      ev.preventDefault();
      const r = stage.getBoundingClientRect();
      const mx = vb.x + (ev.clientX - r.left) / r.width * vb.w,
        my = vb.y + (ev.clientY - r.top) / r.height * vb.h;
      const f = Math.exp(ev.deltaY * 0.0015);
      const nw = Math.max(400, Math.min(W * 2, vb.w * f));
      const k = nw / vb.w;
      vb = {
        w: nw,
        h: vb.h * k,
        x: mx - (mx - vb.x) * k,
        y: my - (my - vb.y) * k,
      };
      applyVB();
    }, { passive: false });
    window.addEventListener("resize", () => fit());
    fit();
    document.getElementById("btnFit").onclick = () => {
      exitStory();
      fit();
    };
    document.getElementById("btnTheme").onclick = function () {
      const html = document.documentElement;
      const light = html.dataset.theme !== "light";
      html.dataset.theme = light ? "light" : "dark";
      this.textContent = light ? "Dark" : "Light";
    };

    // ------------------------------------------------------------------ legends + toggles
    const legend = document.getElementById("legend");
    const kindOn = new Set(Object.keys(kindNames));
    for (const k of Object.keys(kindNames)) {
      const b = document.createElement("button");
      b.className = "chip";
      b.innerHTML = `<span class="sw ${kindNames[k][1]}"></span>${kindNames[k][0]}`;
      b.style.color = `var(--k-${k})`;
      b.onclick = () => {
        if (kindOn.has(k)) kindOn.delete(k);
        else kindOn.add(k);
        b.classList.toggle("off", !kindOn.has(k));
        refresh();
      };
      legend.appendChild(b);
    }
    let showThreats = true, showStatus = true;
    const classOn = new Set(Object.keys(threatClass));
    const tlegend = document.getElementById("tlegend");
    for (const c of Object.keys(threatClass)) {
      const b = document.createElement("button");
      b.className = "chip";
      b.innerHTML = `<span style="color:${
        threatClass[c].color
      };font-size:16px;line-height:0">⬢</span>${threatClass[c].name}`;
      b.onclick = () => {
        if (classOn.has(c)) classOn.delete(c);
        else classOn.add(c);
        b.classList.toggle("off", !classOn.has(c));
        refresh();
      };
      tlegend.appendChild(b);
    }
    const glegend = document.getElementById("glegend");
    for (const s of Object.keys(statusNames)) {
      const b = document.createElement("span");
      b.className = "chip";
      b.style.cssText =
        "display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)";
      b.innerHTML =
        `<span style="color:var(--s-${s});font-size:16px;line-height:0">${
          s === "gap" || s === "intended" ? "◇" : "◆"
        }</span>${statusNames[s]}`;
      glegend.appendChild(b);
    }
    document.getElementById("btnThreats").onclick = function () {
      showThreats = !showThreats;
      this.classList.toggle("on", showThreats);
      refresh();
    };
    document.getElementById("btnStatus").onclick = function () {
      showStatus = !showStatus;
      this.classList.toggle("on", showStatus);
      refresh();
    };

    // ------------------------------------------------------------------ selection / detail
    const detail = document.getElementById("detail");
    let selected = null;
    let story = null, stepI = 0;
    const history = [];
    function statusPill(s) {
      return `<span class="status ${s}">${statusNames[s]}</span>`;
    }
    function linksHtml(links) {
      return links && links.length
        ? `<h3>Landed</h3><ul>${
          links.map(([t, n]) => `<li>${PR(n)} ${t}</li>`).join("")
        }</ul>`
        : "";
    }
    function closeHtml(c) {
      return c && c.length
        ? `<h3>To close the circuit</h3><ul>${
          c.map((x) => `<li>${x}</li>`).join("")
        }</ul>`
        : "";
    }
    function threatsHtml(ts) {
      return ts && ts.length
        ? `<h3>Threats here</h3><ul>${
          ts.map((id) => {
            const t = threats.find((x) => x.id === id);
            const c = threatClass[t.c];
            return `<li><a href="#" data-go="${id}">${t.n} · ${t.t}</a> <span class="status" style="background:${c.color};font-size:10px">${c.name}</span></li>`;
          }).join("")
        }</ul>`
        : "";
    }
    function whereHtml(ids) {
      return ids && ids.length
        ? `<h3>Where</h3><p>${
          ids.map((id) => {
            const n = N[id];
            const g = gateDefs[id];
            return `<a href="#" data-go="${id}">${
              n ? n.t : g ? g.t + " gate" : id
            }</a>`;
          }).join(" · ")
        }</p>`
        : "";
    }
    function renderDetail(id) {
      let html = "";
      const back = history.length > 1
        ? `<a href="#" class="bk" data-back="1">← back</a><br>`
        : "";
      if (N[id]) {
        const n = N[id], d = D[id] || {};
        html = `${back}<span class="kind b-${n.band}">${
          d.kind || n.band
        }</span><h2>${n.t}</h2><p class="hint">${n.s}</p>${d.body || ""}${
          linksHtml(d.links)
        }${threatsHtml(d.threats)}${closeHtml(d.close)}`;
      } else if (gateDefs[id]) {
        const g = gateDefs[id], d = GD[id] || {};
        html = `${back}<span class="kind">Gate · ${g.boundary}</span>${
          statusPill(g.status)
        }<h2>${g.t}</h2>${d.body || ""}${
          d.why ? `<h3>Why it matters</h3><p>${d.why}</p>` : ""
        }${linksHtml(d.links)}${threatsHtml(d.threats)}${closeHtml(d.close)}`;
      } else if (id.startsWith("t")) {
        const t = threats.find((x) => x.id === id),
          d = TD[id] || {},
          c = threatClass[t.c];
        html =
          `${back}<span class="kind">Threat ${t.n}</span><span class="status" style="background:${c.color}">${c.name}</span><h2>${t.t}</h2><p class="hint">${c.blurb}</p>${
            d.body || ""
          }${d.plan ? `<h3>What closes it</h3><p>${d.plan}</p>` : ""}${
            whereHtml(d.where)
          }`;
      } else {
        const e = edges.find((x) => x.id === id);
        if (e) {
          const gd = e.gate && gateDefs[e.gate];
          html =
            `${back}<span class="kind" style="color:var(--k-${e.k});border-color:var(--k-${e.k})">${
              kindNames[e.k][0]
            }</span><h2>${N[e.from].t} → ${N[e.to].t}</h2>${
              e.label ? `<p class="hint">${e.label}</p>` : ""
            }${ED[id] || ""}${
              gd
                ? `<h3>Gate on this edge</h3><p><a href="#" data-go="${e.gate}">${gd.t}</a> ${
                  statusPill(gd.status)
                }</p>`
                : ""
            }`;
        }
      }
      detail.innerHTML = html || welcome();
      detail.scrollTop = 0;
      detail.querySelectorAll("[data-go]").forEach((a) =>
        a.onclick = (ev) => {
          ev.preventDefault();
          select(a.dataset.go, true);
        }
      );
      const bk = detail.querySelector("[data-back]");
      if (bk) {
        bk.onclick = (ev) => {
          ev.preventDefault();
          history.pop();
          const prev = history.pop();
          select(prev, true);
        };
      }
    }
    function welcome() {
      return `<span class="kind">Start here</span><h2>How to read this map</h2><p>Four bands, top to bottom: what we never trust, what we mediate, what we must trust, and how we check ourselves. Data flows left to right; a colleague's request enters at the left and a rendered piece comes back to them there. Only the trusted computing base is tinted: it is the thing this map is about.</p><p><b>Diamonds are gates</b>: the only places a value may cross a boundary. Solid green shipped; solid amber partial; hollow red a gap; dashed gray intended.</p><p><b>Red-ringed hexagons are threats</b>, in three kinds. <span style="color:var(--s-partial)">⬢ closed by planned work</span>: a named gap with an owner. <span style="color:var(--s-shipped)">⬢ guarded by CFC</span>: held today. <span style="color:var(--s-intended)">⬢ remains</span>: CFC cannot close it; people and process hold it. Click one to see where it lives and what holds against it.</p><p><b>Dashed light-blue lines are handles</b>: names for data the model routes without ever holding. That line type is the whole idea. Bright white lines are labeled values inside the base; they never leave it except through a gate.</p><h3>Walks</h3><ul><li><b>The circuit</b>: label at the source → store per path → name don't carry → compute at the data → gated release → every sink a gate → prove it → what is still open.</li><li><b>Demo 1</b>: the Weaver pill, as it ran today.</li><li><b>Demo 2</b>: bills from Gmail and Plaid, with the loom-side gaps named.</li><li><b>Demo 3</b>: a hostile skill with nothing to steal.</li><li><b>Where we trust ourselves</b>: the base, ring by ring.</li></ul><p class="hint">Zoom in for edge labels and gate status captions; they hide at overview so the structure reads first.</p><p class="hint">Snapshot as of ${SNAPSHOT.date}, at labs commit <code>${SNAPSHOT.sha}</code>, fact-checked against the code, the live docs and the issues. Gate statuses follow the boundary inventory on CT-2175, the deviations list in the harness implementation profile, and what merged after both were written. Loom-side claims are from CT-2189 and not verified against loom's code.</p>`;
    }
    function select(id, zoom) {
      selected = id;
      if (history[history.length - 1] !== id) history.push(id);
      renderDetail(id);
      refresh();
      if (zoom) fitTo([id], 260);
    }

    // ------------------------------------------------------------------ stories
    const storyBox = document.getElementById("story");
    function startStory(id) {
      story = stories[id];
      stepI = 0;
      document.querySelectorAll("[data-story]").forEach((b) =>
        b.classList.toggle("on", b.dataset.story === id)
      );
      storyBox.classList.add("on");
      showStep();
    }
    function exitStory() {
      story = null;
      storyBox.classList.remove("on");
      document.querySelectorAll("[data-story]").forEach((b) =>
        b.classList.remove("on")
      );
      refresh();
    }
    function showStep() {
      const s = story.steps[stepI];
      document.getElementById("storyN").innerHTML = `${story.title}<small>step ${
        stepI + 1
      } of ${story.steps.length} · ← → move · Esc exits</small><div class="dots">${
        story.steps.map((_, i) => `<i class="${i === stepI ? "on" : ""}"></i>`)
          .join("")
      }</div>`;
      document.getElementById("storyT").innerHTML = `<b>${s.h}</b>${s.t}`;
      selected = s.sel;
      history.length = 0;
      history.push(s.sel);
      renderDetail(s.sel);
      refresh();
      fitTo(s.f, 160);
      document.getElementById("sNext").textContent =
        stepI === story.steps.length - 1 ? "Done" : "→";
      document.getElementById("sPrev").disabled = stepI === 0;
    }
    document.querySelectorAll("[data-story]").forEach((b) =>
      b.onclick = () => startStory(b.dataset.story)
    );
    document.getElementById("sPrev").onclick = () => {
      if (stepI > 0) {
        stepI--;
        showStep();
      }
    };
    document.getElementById("sNext").onclick = () => {
      if (stepI < story.steps.length - 1) {
        stepI++;
        showStep();
      } else {
        exitStory();
        fit();
      }
    };
    document.getElementById("sClose").onclick = () => {
      exitStory();
      fit();
    };
    window.addEventListener("keydown", (ev) => {
      if (!story) return;
      if (ev.key === "ArrowRight") document.getElementById("sNext").click();
      if (ev.key === "ArrowLeft") document.getElementById("sPrev").click();
      if (ev.key === "Escape") document.getElementById("sClose").click();
    });

    // ------------------------------------------------------------------ refresh classes
    function refresh() {
      const focus = story ? new Set(story.steps[stepI].f) : null;
      const related = new Set();
      if (selected) {
        related.add(selected);
        const e = edges.find((x) => x.id === selected);
        if (e) {
          related.add(e.from);
          related.add(e.to);
          if (e.gate) related.add(e.gate);
        }
        for (const e of edges) {
          if (e.gate === selected) {
            related.add(e.id);
            related.add(e.from);
            related.add(e.to);
          }
          if (N[selected] && (e.from === selected || e.to === selected)) {
            related.add(e.id);
            if (e.gate) related.add(e.gate);
          }
        }
        const td = TD[selected];
        if (td && td.where) td.where.forEach((w) => related.add(w));
      }
      world.querySelectorAll("[data-id]").forEach((g) => {
        const id = g.dataset.id;
        const isEdge = g.classList.contains("edge");
        const isThreat = g.classList.contains("threat");
        const isGate = g.classList.contains("gate");
        g.classList.toggle("sel", id === selected);
        let dim = false, foc = false;
        if (focus) {
          foc = focus.has(id) || (isEdge && (() => {
            const e = edges.find((x) => x.id === id);
            return e && e.gate && focus.has(e.gate);
          })());
          dim = !foc;
        } else if (selected) {
          foc = related.has(id) && id !== selected;
          dim = !related.has(id);
        }
        if (isEdge) {
          const e = edges.find((x) => x.id === id);
          if (!kindOn.has(e.k)) dim = true;
        }
        if (isThreat) {
          g.classList.toggle(
            "hidden",
            !showThreats || !classOn.has(threats.find((t) => t.id === id).c),
          );
        }
        if (isGate) {
          g.querySelector("[data-status]").style.visibility = showStatus
            ? ""
            : "hidden";
          for (const s of Object.keys(statusNames)) {
            g.classList.toggle(s, showStatus && gateDefs[id].status === s);
          }
          g.classList.toggle(
            "intended",
            showStatus ? gateDefs[id].status === "intended" : true,
          );
        }
        g.classList.toggle("dim", dim);
        g.classList.toggle("focus", foc || id === selected);
      });
    }
    renderDetail("");
    refresh();
    </script>
  </body>
</html>
