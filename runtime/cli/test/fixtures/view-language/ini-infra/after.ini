; NOTE: Rapids is the Toolshed staging host.
[all:vars]
ansible_python_interpreter=/usr/bin/python3
server_key_file=../secrets/toolshed-server-key.yml
; API_URL is the toolshed's own public origin.
toolshed_env_overrides={"API_URL":"https://rapids.saga-castor.ts.net","ENV":"staging"}

; SSL Configuration
enable_selfsigned_ssl=true
https_port=8443
cert_common_name=rapids.saga-castor.ts.net

[toolshed]
rapids.saga-castor.ts.net ansible_user=deploy

[rapids]
rapids.saga-castor.ts.net ansible_user=deploy
