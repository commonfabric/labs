<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared Tape Lab</title>
    <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #0a0d0c;
      color: #edf7ee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 300px;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 15% 0%, #243b2d 0, transparent 38rem),
        #0a0d0c;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid #587561;
      border-radius: 999px;
      padding: 0.55rem 0.9rem;
      background: #18211b;
      color: inherit;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #26362b;
    }
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid #d8e45b;
      outline-offset: 2px;
    }
    button:disabled {
      cursor: wait;
      opacity: 0.45;
    }

    #root {
      min-height: 100vh;
    }

    .app {
      width: min(100%, 980px);
      margin: 0 auto;
      padding: clamp(1rem, 4vw, 3rem);
    }

    .eyebrow {
      margin: 0 0 0.5rem;
      color: #aabd9f;
      font-size: 0.72rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 16ch;
      margin: 0;
      font: 500 clamp(2.5rem, 8vw, 5.8rem)/0.9 Georgia, serif;
      letter-spacing: -0.055em;
    }

    .deck {
      max-width: 56ch;
      margin: 1rem 0 2rem;
      color: #b8c8bb;
      line-height: 1.55;
    }

    .tape-deck {
      border: 1px solid #3d5143;
      border-radius: 1.25rem;
      padding: clamp(1rem, 3vw, 1.5rem);
      background: #111713e6;
      box-shadow: 0 1.5rem 5rem #0008;
    }

    .tape-heading,
    .annotation-heading,
    .card-top,
    .confidence-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .recording-label {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .timecode {
      color: #d8e45b;
      font-variant-numeric: tabular-nums;
    }

    audio {
      width: 100%;
      margin: 1rem 0;
      accent-color: #d8e45b;
    }

    .scrubber-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.8rem;
      align-items: center;
      margin: -0.3rem 0 1rem;
      color: #d8e45b;
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }

    .scrubber-row input {
      width: 100%;
      accent-color: #d8e45b;
    }

    .transport-note,
    .status,
    .empty,
    .byline {
      color: #92a596;
      font-size: 0.84rem;
    }

    .transport-note {
      margin: 0;
    }
    .status {
      min-height: 1.3rem;
      margin: 0.8rem 0 0;
    }
    .status[data-ready="true"] {
      color: #bccc78;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-top: 1rem;
    }

    .annotations {
      margin-top: 2.5rem;
    }
    .annotation-heading h2 {
      margin: 0;
      font: 500 1.7rem Georgia, serif;
    }
    .annotation-count {
      color: #aabd9f;
    }

    .annotation-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr));
      gap: 0.8rem;
      margin-top: 1rem;
    }

    .annotation-card {
      border: 1px solid #33473a;
      border-radius: 1rem;
      padding: 1rem;
      background: #111713;
      transition: border-color 120ms ease, transform 120ms ease;
    }

    .annotation-card[data-selected="true"] {
      border-color: #d8e45b;
    }
    .annotation-card[data-active="true"] {
      border-color: #87d4a0;
      transform: translateY(-2px);
    }

    .annotation-card h3 {
      margin: 0;
      font: 600 1.15rem Georgia, serif;
    }
    .annotation-card p {
      min-height: 2.5em;
      margin: 0.65rem 0;
      line-height: 1.4;
    }
    .annotation-card .toolbar {
      margin-top: 0.85rem;
    }

    .confidence-row {
      margin-top: 0.75rem;
    }
    .confidence-row meter {
      width: 9rem;
      accent-color: #d8e45b;
    }
    .assessment-editor {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.6rem;
    }
    .assessment-editor input {
      width: 100%;
      accent-color: #d8e45b;
    }

    .consensus-panel {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.8rem 1rem;
      align-items: center;
      margin-top: 1rem;
      border-top: 1px solid #33473a;
      padding-top: 1rem;
    }

    .consensus-panel meter {
      width: min(18rem, 50vw);
      height: 1.2rem;
    }
    .consensus-label {
      grid-column: 1 / -1;
      color: #aabd9f;
    }

    .error {
      min-height: 1.3rem;
      margin: 1rem 0 0;
      color: #ff9f8f;
      white-space: pre-wrap;
    }

    dialog {
      width: min(calc(100% - 2rem), 34rem);
      border: 1px solid #587561;
      border-radius: 1.2rem;
      padding: 0;
      background: #151c17;
      color: #edf7ee;
      box-shadow: 0 1.5rem 5rem #000b;
    }

    dialog::backdrop {
      background: #020403cc;
      backdrop-filter: blur(4px);
    }
    .dialog-body {
      display: grid;
      gap: 1rem;
      padding: 1.3rem;
    }
    .dialog-body h2 {
      margin: 0;
      font: 500 1.6rem Georgia, serif;
    }
    .field {
      display: grid;
      gap: 0.4rem;
    }
    .field span {
      color: #b8c8bb;
      font-size: 0.82rem;
    }
    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid #496051;
      border-radius: 0.65rem;
      padding: 0.7rem;
      background: #0b100d;
      color: inherit;
    }
    .field textarea {
      min-height: 6rem;
      resize: vertical;
    }
    .time-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }
    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.65rem;
    }

    @media (max-width: 520px) {
      .tape-heading,
      .annotation-heading {
        align-items: flex-start;
        flex-direction: column;
      }
      .time-fields {
        grid-template-columns: 1fr;
      }
    }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- PATTERN_IFRAME_SCRIPT -->
  </body>
</html>
