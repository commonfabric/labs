<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Collaborative Impossible Machine</title>
    <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #e9f1ff;
    }

    * {
      box-sizing: border-box;
    }
    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      margin: 0;
    }
    body {
      overflow: hidden;
    }
    button,
    input,
    select {
      font: inherit;
    }
    button,
    select,
    input {
      border: 1px solid #35445e;
      border-radius: 8px;
      background: #111d31;
      color: #e9f1ff;
    }
    button {
      cursor: pointer;
    }
    button:hover:not(:disabled) {
      border-color: #73d9c5;
      background: #18283f;
    }
    button:disabled,
    input:disabled,
    select:disabled {
      cursor: wait;
      opacity: 0.5;
    }
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #73d9c5;
      outline-offset: 2px;
    }

    .machine-app {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 12% 0%, rgba(85, 214, 190, 0.11), transparent
        34%),
        radial-gradient(circle at 85% 20%, rgba(167, 139, 250, 0.09), transparent
        38%),
        #07111f;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding: 18px 24px 14px;
      border-bottom: 1px solid rgba(101, 121, 153, 0.26);
    }
    .app-header h1 {
      margin: 2px 0 4px;
      font-size: clamp(22px, 2.5vw, 34px);
      letter-spacing: -0.04em;
    }
    .app-header p {
      margin: 0;
      color: #9db0cd;
    }
    .eyebrow {
      color: #73d9c5 !important;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .telemetry {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .telemetry span,
    .telemetry strong {
      padding: 7px 10px;
      border: 1px solid #2f405c;
      border-radius: 999px;
      background: rgba(15, 27, 46, 0.78);
      font-size: 12px;
      white-space: nowrap;
    }
    .telemetry strong {
      color: #ff8ba2;
      border-color: rgba(255, 107, 138, 0.45);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 24px;
      border-bottom: 1px solid rgba(101, 121, 153, 0.22);
      background: rgba(7, 17, 31, 0.82);
    }
    .add-controls,
    .simulation-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .add-controls > span {
      margin-right: 5px;
      color: #8295b2;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .toolbar button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 6px 10px;
      font-size: 12px;
    }
    .toolbar button.is-on {
      border-color: #55d6be;
      color: #b7ffea;
      background: rgba(34, 99, 91, 0.35);
    }
    .simulation-controls output {
      min-width: 54px;
      text-align: center;
      color: #cbd8eb;
      font: 700 12px ui-monospace, monospace;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    .flow-shell {
      position: relative;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-right: 1px solid #24334c;
    }
    .inspector {
      display: flex;
      flex-direction: column;
      gap: 22px;
      overflow: auto;
      padding: 20px;
      background: rgba(10, 22, 39, 0.88);
    }
    .inspector h2 {
      margin: 4px 0 7px;
      font-size: 20px;
    }
    .inspector h3 {
      margin: 0 0 10px;
      font-size: 13px;
    }
    .inspector p {
      margin: 0;
      color: #9db0cd;
      font-size: 12px;
      line-height: 1.55;
    }
    .wire-builder,
    .wire-conflicts,
    .legend {
      display: grid;
      gap: 9px;
      padding: 14px;
      border: 1px solid #283a55;
      border-radius: 12px;
      background: rgba(18, 32, 53, 0.72);
    }
    .wire-builder label {
      display: grid;
      gap: 5px;
      color: #91a5c2;
      font-size: 11px;
    }
    .wire-builder select,
    .wire-builder button,
    .wire-conflicts button {
      width: 100%;
      min-height: 34px;
      padding: 6px 8px;
    }
    .wire-conflicts {
      border-color: rgba(255, 107, 138, 0.5);
    }
    .wire-conflicts button {
      color: #ffd3da;
    }
    .pulse {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 50%;
      background: #546279;
    }
    .pulse--high {
      background: #b7ffea;
      box-shadow: 0 0 9px #55d6be;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      min-height: 32px;
      padding: 7px 16px;
      border-top: 1px solid #24334c;
      color: #8295b2;
      background: #081320;
      font-size: 11px;
    }
    .action-error {
      color: #ff9caf;
    }
    .fatal-error,
    .loading-view {
      margin: 0;
      padding: 40px;
    }
    .fatal-error {
      color: #ff9caf;
    }
    .loading-view {
      display: grid;
      place-content: center;
      justify-items: center;
      height: 100%;
      text-align: center;
      background: #07111f;
    }
    .loading-view h1 {
      margin-bottom: 3px;
    }
    .loading-view p {
      color: #9db0cd;
    }
    .loading-view button {
      padding: 8px 12px;
    }
    .loading-orbit {
      font-size: 42px;
      color: #73d9c5;
      animation: orbit 1.4s ease-in-out infinite alternate;
    }
    @keyframes orbit {
      to {
        transform: rotate(180deg) scale(1.18);
        color: #a78bfa;
      }
    }

    /* Minimal React Flow structural CSS, kept inline so the wrapper emits one script. */
    .react-flow {
      direction: ltr;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #091525;
    }
    .react-flow__container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .react-flow__pane {
      z-index: 1;
      touch-action: none;
    }
    .react-flow__pane.draggable {
      cursor: grab;
    }
    .react-flow__pane.dragging,
    .react-flow__node.draggable.dragging {
      cursor: grabbing;
    }
    .react-flow__viewport {
      z-index: 2;
      transform-origin: 0 0;
      pointer-events: none;
    }
    .react-flow__renderer {
      z-index: 4;
    }
    .react-flow__selection {
      z-index: 6;
    }
    .react-flow__nodes {
      pointer-events: none;
      transform-origin: 0 0;
    }
    .react-flow__node {
      position: absolute;
      box-sizing: border-box;
      transform-origin: 0 0;
      pointer-events: all;
      user-select: none;
    }
    .react-flow__node-sensor,
    .react-flow__node-gate,
    .react-flow__node-delay,
    .react-flow__node-transformer,
    .react-flow__node-actuator {
      width: 218px;
    }
    .react-flow__node.draggable {
      cursor: grab;
    }
    .react-flow .react-flow__edges,
    .react-flow .react-flow__edges svg {
      position: absolute;
      overflow: visible;
      pointer-events: none;
    }
    .react-flow__edge {
      pointer-events: visibleStroke;
    }
    .react-flow__edge-path,
    .react-flow__connection-path {
      fill: none;
    }
    svg.react-flow__connectionline {
      position: absolute;
      z-index: 1001;
      overflow: visible;
    }
    .react-flow__edge.animated path {
      stroke-dasharray: 5;
      animation: dashdraw 0.55s linear infinite;
    }
    .react-flow__edge.animated path.react-flow__edge-interaction {
      stroke-dasharray: none;
      animation: none;
    }
    .react-flow__edge-text {
      pointer-events: none;
      user-select: none;
    }
    .react-flow__edgelabel-renderer,
    .react-flow__viewport-portal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      user-select: none;
    }
    .react-flow__handle {
      position: absolute;
      min-width: 12px;
      min-height: 12px;
      border: 2px solid #07111f;
      border-radius: 50%;
      background: #8da0bd;
      pointer-events: none;
    }
    .react-flow__handle.connectionindicator {
      pointer-events: all;
      cursor: crosshair;
    }
    .react-flow__handle-left {
      top: 50%;
      left: 0;
      transform: translate(-50%, -50%);
    }
    .react-flow__handle-right {
      top: 50%;
      right: 0;
      transform: translate(50%, -50%);
    }
    .react-flow__panel {
      position: absolute;
      z-index: 5;
      margin: 12px;
    }
    .react-flow__panel.left {
      left: 0;
    }
    .react-flow__panel.right {
      right: 0;
    }
    .react-flow__panel.top {
      top: 0;
    }
    .react-flow__panel.bottom {
      bottom: 0;
    }
    .react-flow__background {
      z-index: -1;
      pointer-events: none;
    }
    .react-flow__minimap {
      width: 150px;
      height: 92px;
      overflow: hidden;
      border: 1px solid #35445e;
      border-radius: 9px;
      background: #0b1728;
    }
    .react-flow__minimap-svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .react-flow__minimap-mask {
      fill: rgba(5, 12, 24, 0.72);
    }
    .react-flow__minimap-node {
      stroke-width: 2;
    }
    .react-flow__controls {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #35445e;
      border-radius: 9px;
      box-shadow: none;
    }
    .react-flow__controls-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 6px;
      border: 0;
      border-bottom: 1px solid #35445e;
      border-radius: 0;
      background: #111d31;
      color: #d7e3f5;
    }
    .react-flow__controls-button:last-child {
      border-bottom: 0;
    }
    .react-flow__controls-button svg {
      width: 100%;
      max-width: 13px;
      max-height: 13px;
      fill: currentColor;
    }
    .react-flow__attribution {
      margin: 0;
      padding: 2px 4px;
      background: rgba(7, 17, 31, 0.72);
      font-size: 9px;
    }
    .react-flow__attribution a {
      color: #7083a0;
      text-decoration: none;
    }
    @keyframes dashdraw {
      from {
        stroke-dashoffset: 10;
      }
    }

    .machine-node {
      width: 100%;
      overflow: hidden;
      border: 1px solid #3b4a63;
      border-top: 3px solid var(--node-color, #8da0bd);
      border-radius: 13px;
      background: linear-gradient(155deg, rgba(25, 41, 65, 0.98), rgba(12, 23, 40,
        0.98));
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }
    .machine-node--sensor {
      --node-color: #55d6be;
    }
    .machine-node--gate {
      --node-color: #a78bfa;
    }
    .machine-node--delay {
      --node-color: #f4bf63;
    }
    .machine-node--transformer {
      --node-color: #5ea8ff;
    }
    .machine-node--actuator {
      --node-color: #ff6b8a;
    }
    .react-flow__node.selected .machine-node {
      border-color: var(--node-color);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--node-color) 40%, transparent),
        0 14px 34px rgba(0, 0, 0, 0.42);
    }
    .machine-node.is-active {
      box-shadow: 0 0 26px color-mix(in srgb, var(--node-color) 27%, transparent), 0
        12px 30px rgba(0, 0, 0, 0.32);
    }
    .machine-node.is-active .react-flow__handle {
      background: #b7ffea;
      box-shadow: 0 0 8px #55d6be;
    }
    .machine-node header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 12px;
      border-bottom: 1px solid rgba(104, 124, 156, 0.23);
    }
    .machine-node header small,
    .machine-node header strong {
      display: block;
    }
    .machine-node header small {
      margin-bottom: 2px;
      color: var(--node-color);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }
    .machine-node header strong {
      overflow: hidden;
      color: #edf4ff;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .machine-node header output {
      color: #b9c8dd;
      font: 700 11px ui-monospace, monospace;
    }
    .node-icon {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      border-radius: 8px;
      background: color-mix(in srgb, var(--node-color) 18%, transparent);
      color: var(--node-color);
      font-size: 17px;
    }
    .node-parameters {
      display: grid;
      gap: 8px;
      padding: 10px 12px 12px;
    }
    .parameter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: #94a8c5;
      font-size: 10px;
    }
    .parameter-row input,
    .parameter-row select {
      width: 82px;
      min-height: 27px;
      padding: 3px 6px;
      font-size: 11px;
    }
    .sensor-toggle {
      width: 100%;
      min-height: 29px;
      color: #8de9d7;
      font-size: 11px;
    }
    .actuator-state {
      margin: 0;
      color: #ff9caf;
      font-size: 11px;
      font-weight: 800;
      text-align: center;
    }

    @media (max-width: 820px) {
      .app-header {
        align-items: flex-start;
        padding: 13px 15px;
      }
      .app-header > div > p:last-child {
        display: none;
      }
      .telemetry span {
        display: none;
      }
      .toolbar {
        align-items: flex-start;
        padding: 8px 12px;
      }
      .add-controls button {
        width: 32px;
        overflow: hidden;
        padding: 6px;
        white-space: nowrap;
      }
      .add-controls button span {
        min-width: 18px;
      }
      .workspace {
        grid-template-columns: minmax(0, 1fr) 205px;
      }
      .inspector {
        padding: 12px;
      }
    }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- PATTERN_IFRAME_SCRIPT -->
  </body>
</html>
